<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斷面性質計算工具</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="結構工具箱/assets/hy/colors_and_type.css">
<link rel="stylesheet" href="tool-chrome.css">
<link rel="stylesheet" href="結構工具箱/core/direct-print-boundary.css">
<link rel="stylesheet" href="結構工具箱/core/family-theme.css">
<link rel="stylesheet" href="結構工具箱/core/tool-shell.css">
<style>
  :root {
    --primary: var(--hy-navy);
    --primary-dark: var(--hy-navy-deep);
    --primary-accent: var(--hy-navy-500);
    --bg: var(--bg-subtle);
    --card: var(--bg-surface);
    --border: var(--border-strong);
    --text: var(--fg-1);
    --text-light: var(--fg-2);
    --accent: var(--hy-success);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: var(--bg); color: var(--text); line-height: 1.6; }
  header { background: var(--bg-navy); color: var(--fg-on-navy); box-shadow: var(--shadow-md); border-bottom: 1px solid var(--border-navy); }
  header h1 { font-size: 1.55em; letter-spacing: 0.02em; font-weight: 700; }
  header p { font-size: 0.85em; opacity: 0.88; margin-top: 4px; }
  .container { max-width: 1240px; margin: 20px auto; padding: 0 20px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; background: var(--card); padding: 8px 10px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 9px 16px; border: 1px solid transparent; background: transparent; color: var(--text-light); font-size: 0.9em; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.18s ease; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
  .tab-btn:hover { background: var(--bg-subtle); color: var(--primary); border-color: var(--border-default); }
  .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-accent)); color: var(--fg-on-navy); box-shadow: var(--shadow-md); }
  .main-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
  .auto-calc-badge { margin-top: 12px; padding: 8px 12px; background: linear-gradient(135deg, var(--hy-navy-50), var(--bg-page)); border: 1px dashed var(--hy-navy-300); border-radius: 8px; color: var(--hy-navy); font-size: 0.8em; font-weight: 600; text-align: center; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-md); }
  .card h2 { font-size: 1.1em; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--border-default); color: var(--primary); font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.85em; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.98em; font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: var(--bg-surface); color: var(--text); }
  .form-group input[type="number"] { font-family: 'Consolas', 'Segoe UI', monospace; font-variant-numeric: tabular-nums; }
  .form-group input:focus, .form-group select:focus { border-color: var(--primary-accent); box-shadow: var(--shadow-focus); }
  .h-filter-input { width: 100%; padding: 7px 11px; margin-bottom: 6px; border: 1.5px dashed var(--border); border-radius: 7px; font-size: 0.86em; font-family: inherit; background: var(--bg-page); color: var(--text); outline: none; transition: border-color 0.2s, background 0.2s; }
  .h-filter-input:focus { border-color: var(--primary-accent); border-style: solid; background: var(--bg-surface); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn-calc { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-accent)); color: var(--fg-on-navy); border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; box-shadow: var(--shadow-sm); transition: filter 0.15s, transform 0.1s; }
  .btn-calc:hover { filter: brightness(1.08); }
  .btn-calc:active { transform: translateY(1px); }
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-page); border-radius: 8px; border: 1px solid var(--border-default); border-left: 3.5px solid var(--primary); transition: background 0.15s, border-color 0.15s; }
  .result-item:hover { background: var(--bg-subtle); border-color: var(--border-strong); border-left-color: var(--primary-accent); }
  .result-item .label { font-size: 0.85em; color: var(--text-light); font-weight: 600; }
  .result-item .val-wrap { cursor: pointer; padding: 2px 6px; border-radius: 5px; transition: background 0.15s; text-align: right; white-space: nowrap; }
  .result-item .val-wrap:hover { background: var(--border-default); }
  .result-item .value { font-size: 1.02em; font-weight: 700; font-family: 'Consolas',monospace; font-variant-numeric: tabular-nums; color: var(--primary-dark); }
  .result-item .unit { font-size: 0.75em; color: var(--text-light); margin-left: 4px; font-family: 'Consolas', sans-serif; }
  .canvas-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 4px; background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border); min-height: 250px; padding: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow-inset); }
  canvas { display: block; max-width: 100%; }
  .section-panel { display: none; }
  .section-panel.active { display: block; }
  .hint { font-size: 0.8em; color: var(--text-light); margin-top: 4px; font-style: italic; }
  .right-panel { display: flex; flex-direction: column; gap: 20px; }
  .sub-select { margin-bottom: 14px; }
  .status-msg { display: none; margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 0.84em; line-height: 1.45; font-weight: 500; }
  .status-msg.ok { display: block; background: var(--hy-success-100); color: var(--hy-success); border: 1px solid color-mix(in srgb, var(--hy-success) 38%, var(--bg-surface)); }
  .status-msg.warn { display: block; background: var(--hy-warning-100); color: var(--hy-warning-ink); border: 1px solid color-mix(in srgb, var(--hy-warning) 35%, var(--bg-surface)); }
  .status-msg.error { display: block; background: var(--hy-danger-100); color: var(--hy-red-deep); border: 1px solid color-mix(in srgb, var(--hy-danger) 32%, var(--bg-surface)); }
  .case-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; padding:10px 14px; background:var(--bg-surface); border:1px solid var(--border); border-radius:10px; box-shadow: var(--shadow-sm); }
  .case-bar button, .action-chip-btn { padding:7px 11px; border:1px solid var(--border); background:var(--bg-surface); color:var(--text); border-radius:7px; cursor:pointer; font-family:inherit; font-size:.82em; font-weight:600; transition: all 0.15s; }
  .case-bar button:hover, .action-chip-btn:hover { background:var(--bg-subtle); border-color:var(--border-strong); color:var(--primary); }
  .case-bar .bar-sep { width:1px; height:20px; background:var(--border); margin:0 2px; }
  .case-bar label { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:.84em; color:var(--text-light); font-weight:600; }
  .comp-table-wrap { overflow-x: auto; margin-top: 10px; }
  .comp-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  .comp-table th, .comp-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-default); text-align: right; font-variant-numeric: tabular-nums; }
  .comp-table th:first-child, .comp-table td:first-child { text-align: left; font-weight: 600; color: var(--text-light); white-space: nowrap; }
  .comp-table th { background: var(--bg-page); color: var(--primary); font-weight: 700; border-bottom: 2px solid var(--border); }
  .comp-table td.num { font-family: 'Consolas', monospace; font-weight: 600; color: var(--text); }
  .comp-delta { font-size: 0.78em; font-weight: 600; margin-left: 4px; padding: 1px 4px; border-radius: 4px; }
  .comp-delta.pos { color: var(--hy-success); background: var(--hy-success-100); }
  .comp-delta.neg { color: var(--hy-red-deep); background: var(--hy-danger-100); }
  .comp-delta.zero { color: var(--fg-3); }
  @media (max-width: 900px) {
    .main-layout { grid-template-columns: minmax(0, 1fr); }
  }
  @media print { .page-only-tool-actions { display:none !important; } }
  @media (max-width: 768px) {
    .results-grid { grid-template-columns: 1fr; }
    header { padding: 14px 16px; }
    header h1 { font-size: 1.25em; }
    .container { margin: 12px auto; padding: 0 12px; }
    .card { padding: 16px; }
    .tabs { flex-wrap: nowrap; padding: 6px; }
    .tab-btn { padding: 9px 13px; font-size: 0.85em; }
    .form-group input, .form-group select { padding: 10px 12px; font-size: 0.95em; }
    .btn-calc { padding: 13px; font-size: 0.95em; }
  }
  @media (max-width: 480px) {
    header h1 { font-size: 1.1em; }
    header p { font-size: 0.78em; }
    .container { margin: 8px auto; padding: 0 8px; }
    .card { padding: 12px; border-radius: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group input, .form-group select { padding: 11px 10px; font-size: 1em; }
    .btn-calc { padding: 14px; font-size: 1em; }
    .result-item { padding: 9px 10px; }
    .result-item .label { font-size: 0.8em; }
    .result-item .value { font-size: 0.95em; }
    .form-row3 { grid-template-columns: 1fr 1fr; }
  }
</style>

<script>
const PI = Math.PI;
const SECTION_TOOL_METADATA = window.AnalysisSectionToolMetadata?.section;
if (!SECTION_TOOL_METADATA) throw new Error('斷面性質工具版本資料未載入');
const SECTION_TOOL_VERSION = SECTION_TOOL_METADATA.version;
const SECTION_CALCULATION_ENGINE = SECTION_TOOL_METADATA.calculationEngine;
document.title = `斷面性質計算工具 ${SECTION_TOOL_VERSION}`;
document.getElementById('sectionToolVersion').textContent = SECTION_TOOL_VERSION;
function val(id) { return parseFloat(document.getElementById(id).value) || 0; }
function fmt(v) { if (v === 0) return '0'; if (Math.abs(v) < 0.001 && v !== 0) return v.toExponential(4); return parseFloat(v.toPrecision(6)); }
function setStatus(message, tone = 'warn') {
  const el = document.getElementById('exportStatus');
  if (!el) return;
  el.textContent = message || '';
  el.className = `status-msg${message ? ` ${tone}` : ''}`;
}

let lastResults = [];
let lastTitle = '';

// 是否由連續梁工具以 pickI 模式開啟
const PICK_I_MODE = new URLSearchParams(location.search).get('pickI') === '1';
window.addEventListener('load', () => {
  if (PICK_I_MODE) {
    const btn = document.getElementById('btnPickI');
    if (btn) btn.style.display = 'inline-block';
  }
});

// 從 lastResults 取出 Ix（優先 Ix，其次單軸 I）；回傳 cm⁴
function extractIx() {
  if (!lastResults || !lastResults.length) return null;
  // 先找含 "Ix" 的項
  let found = lastResults.find(r => /^\s*Ix\b/i.test(String(r[0])));
  // 其次找純 "I " 開頭（圓形、管形單軸）
  if (!found) found = lastResults.find(r => /^\s*I\s*(\(|$|\s)/i.test(String(r[0])) && !/Iy/i.test(String(r[0])));
  if (!found) return null;
  return { value: parseFloat(found[1]), label: found[0] };
}

// 取出斷面之原始尺寸 (cm) — 供下游 RC 設計工具填入 b、h、D
// 回傳 { shape:'rect'|'circle'|'other', b, h, D }
function extractSection() {
  const tab = currentTab;
  const v = id => { const e = document.getElementById(id); return e ? parseFloat(e.value)/10 : null; }; // mm → cm
  if (tab === 'solid-rect') {
    return { shape:'rect', b: v('sr-b'), h: v('sr-h') };
  }
  if (tab === 'solid-circle') {
    return { shape:'circle', D: v('sc-d') };
  }
  if (tab === 'geo') {
    const g = document.getElementById('geo-type')?.value;
    if (g === 'rect-c' || g === 'rect-e' || g === 'rect-rot') {
      return { shape:'rect', b: v('g-b'), h: v('g-h') };
    }
    if (g === 'solid-circle') {
      return { shape:'circle', D: v('g-d') };
    }
  }
  return { shape:'other' };
}

function sendIxToOpener() {
  if (!window.opener || window.opener.closed) { setStatus('找不到連續梁工具視窗，請重新從該工具開啟', 'error'); return; }
  const ix = extractIx();
  if (!ix || !isFinite(ix.value)) { setStatus('尚未計算出 Ix，請先完成斷面計算', 'warn'); return; }
  const section = extractSection();
  try {
    window.opener.postMessage({
      source:'sectionTool',
      Ix_cm4: ix.value,
      title: lastTitle,
      section,           // {shape, b, h, D} (cm)
    }, '*');
  } catch (e) { setStatus('傳送失敗: ' + e.message, 'error'); return; }
  setStatus('已導入至連續梁工具', 'ok');
  // 延遲關閉讓訊息送達
  setTimeout(() => window.close(), 120);
}

function showResults(items) {
  setStatus('');
  lastResults = items;
  const tabObj = tabs.find(t => t.id === currentTab);
  const tabName = tabObj ? tabObj.name : '';
  if (currentTab === 'h-beam') {
    const sel = document.getElementById('h-select');
    const selVal = sel && sel.value;
    lastTitle = selVal ? (sel.options[sel.selectedIndex]?.text.split(' (')[0] || tabName) : tabName;
  } else if (currentTab === 'geo') {
    const gSel = document.getElementById('geo-type');
    const gText = gSel ? (gSel.options[gSel.selectedIndex]?.text || '') : '';
    lastTitle = tabName + (gText ? ' - ' + gText : '');
  } else {
    lastTitle = tabName;
  }
  document.getElementById('results').innerHTML = items.map(([l,v,u], idx) =>
    `<div class="result-item" style="gap:8px;"><input type="checkbox" class="res-cb" checked onchange="redrawSectionCard()" style="flex-shrink:0;width:15px;height:15px;cursor:pointer;accent-color:var(--primary);"><span class="label">${l}</span><span class="val-wrap" onclick="copySingleResult(${idx})" title="點擊複製 ${escapeHtml(l)} 數值"><span class="value">${fmt(v)}</span><span class="unit">${u}</span></span></div>`).join('');
}

function clearSectionResults() {

  lastTitle = '';
  document.getElementById('results').innerHTML = '<div class="result-item">請補齊有效斷面尺寸</div>';

}

async function writeTextToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(ta);
  return ok;
}

async function copySectionText(text, success) {
  if (await writeTextToClipboard(text)) setStatus(success, 'ok');
  else setStatus('無法複製，請允許瀏覽器存取剪貼簿後重試。', 'warn');
}

async function copySingleResult(index) {
  const item = lastResults[index];

  const [label, value, unit] = item;
  const formatted = String(fmt(value));

function getCheckedResults() {

}

  const allChecked = cbs.every(cb => cb.checked);
  cbs.forEach(cb => cb.checked = !allChecked);
  redrawSectionCard();
}

function selectCoreResults() {
  const corePattern = /^\s*(A|W|Ix|Iy|I|Sx|Sy|S|Sx_top|Sx_bot|Sx \(控制\)|Zx|Zy|Z|rx|ry|r)\b/i;
  const cbs = [...document.querySelectorAll('.res-cb')];
  let count = 0;
  cbs.forEach((cb, i) => {
    const label = String(lastResults[i]?.[0] || '');
    const isCore = corePattern.test(label) && !/Avx|Avy|I \(參考軸\)|I \(底邊軸\)|I \(下底軸\)|I \(尖端軸\)/i.test(label);
    cb.checked = isCore;
    if (isCore) count++;
  });
  if (count === 0) cbs.forEach(cb => { cb.checked = true; });
  redrawSectionCard();
  setStatus(`已篩選勾選 ${count || cbs.length} 項常用核心斷面性質（計算指紋 ${sectionCalculationFingerprint()}）`, 'ok');
}

const SECTION_PROJECT_SCHEMA = 'section-properties.project.v1';

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function collectSectionInputs() {
  const inputs = {};
  document.querySelectorAll('#input-panel input[id], #input-panel select[id]').forEach(el => { inputs[el.id] = el.value; });
  const custom = [...document.querySelectorAll('#custom-rects .custom-rect-row')].map(row => ({
    b: row.querySelector('.rect-b')?.value ?? '',
    h: row.querySelector('.rect-h')?.value ?? '',
    yc: row.querySelector('.rect-yc')?.value ?? '',
  }));
  return { inputs, custom };
}

function collectSectionProjectData() {
  const source = collectSectionInputs();
  return {
    schema: SECTION_PROJECT_SCHEMA,
    version: 1,
    toolVersion: SECTION_TOOL_VERSION,
    calculationEngine: SECTION_CALCULATION_ENGINE,
    savedAt: new Date().toISOString(),
    section: {
      tab: currentTab,
      inputs: source.inputs,
      custom: source.custom,
      selectedResults: [...document.querySelectorAll('.res-cb')].map((cb, i) => cb.checked ? String(lastResults[i]?.[0] || '') : '').filter(Boolean),
    },
    calculation: {
      title: lastTitle,
      results: lastResults.map(([label, value, unit]) => ({ label: String(label), value: Number(value), unit: String(unit || '') })),
      fingerprint: sectionCalculationFingerprint(),
    },
  };
}

function stableSectionHash(value, seed) {
  let hash = seed >>> 0;
  const text = JSON.stringify(value);
  for (let i = 0; i < text.length; i += 1) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619) >>> 0;
  }
  return hash.toString(16).toUpperCase().padStart(8, '0');
}

function sectionCalculationFingerprint(engine = SECTION_CALCULATION_ENGINE) {
  const source = collectSectionInputs();
  const payload = {
    calculationEngine: engine,
    tab: currentTab,
    inputs: source.inputs,
    custom: source.custom,
    selectedResults: getCheckedResults().map(([label]) => String(label)),
    results: lastResults.map(([label, value, unit]) => [String(label), Number(value), String(unit || '')]),
  };
  return sectionPayloadFingerprint(payload);
}

function sectionPayloadFingerprint(payload) {
  return `CF-${stableSectionHash(payload, 2166136261)}${stableSectionHash(payload, 2246822507)}`;
}

function previousSectionEngine(data) {
  return data.calculationEngine === 'section-properties.inline.v2.2.0';
}

function revisedSectionGeometry(section) {
  return section.tab === 'geo' && ['oblong','sym-trapezoid','general','parabola','half-parabola'].includes(section.inputs['geo-type']);
}

function validateSectionInputData(section) {
  if (!section || !tabs.some(tab => tab.id === section.tab)) throw new Error('案例缺少有效的斷面類型');
  if (!section.inputs || typeof section.inputs !== 'object' || Array.isArray(section.inputs)) throw new Error('案例缺少尺寸輸入');
  const entries = Object.entries(section.inputs);
  if (entries.length > 80 || entries.some(([key, value]) => !/^[A-Za-z0-9_-]{1,40}$/.test(key) || !['string','number'].includes(typeof value))) {
    throw new Error('案例尺寸欄位不合法');
  }
  if (section.tab === 'custom') {
    if (!Array.isArray(section.custom) || !section.custom.length || section.custom.length > 50) throw new Error('自訂斷面矩形資料不合法');
    section.custom.forEach((rect, index) => {
      const b = Number(rect?.b), h = Number(rect?.h), yc = Number(rect?.yc);
      if (!Number.isFinite(b) || b <= 0 || !Number.isFinite(h) || h <= 0 || !Number.isFinite(yc)) {
        throw new Error(`第 ${index + 1} 個矩形尺寸不合法`);
      }
    });
  }
}

function validateSectionProjectData(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('案例內容不是有效物件');
  if (data.schema !== SECTION_PROJECT_SCHEMA || data.version !== 1) throw new Error('案例格式或版本不相容');
  const section = data.section;
  validateSectionInputData(section);
  const fingerprint = data.calculation?.fingerprint;
  if (!/^CF-[0-9A-F]{16}$/.test(String(fingerprint || ''))) throw new Error('案例缺少有效計算指紋');
  if (previousSectionEngine(data)) {
    const records = data.calculation.results;
    if (!Array.isArray(records) || !records.length || !Array.isArray(section.selectedResults) || !Array.isArray(section.custom)
        || !records.every(r => r && typeof r.label === 'string' && Number.isFinite(r.value) && typeof r.unit === 'string')) throw new Error('舊版案例缺少來源結果。');
    const original = { calculationEngine:data.calculationEngine, tab:section.tab, inputs:section.inputs, custom:section.custom,
      selectedResults:section.selectedResults, results:records.map(r => [r.label,r.value,r.unit]) };
    if (sectionPayloadFingerprint(original) !== fingerprint) throw new Error('舊版案例來源指紋不符。');
  }
  return data;
}

function applySectionProjectDataUnchecked(checked, verifyFingerprint = true) {
  const section = checked.section;
  switchTab(section.tab);
  if (section.tab === 'geo' && section.inputs['geo-type']) {
    document.getElementById('geo-type').value = section.inputs['geo-type'];
    buildGeoInputs();
  }
  if (section.tab === 'custom') {
    while (document.querySelectorAll('#custom-rects .custom-rect-row').length < section.custom.length) addRect();
    while (document.querySelectorAll('#custom-rects .custom-rect-row').length > section.custom.length) removeRect();
  }
  document.querySelectorAll('#input-panel input[id], #input-panel select[id]').forEach(el => {
    if (Object.hasOwn(section.inputs, el.id)) el.value = String(section.inputs[el.id]);
  });
  if (section.tab === 'custom') {
    [...document.querySelectorAll('#custom-rects .custom-rect-row')].forEach((row, index) => {
      const rect = section.custom[index];
      row.querySelector('.rect-b').value = rect.b;
      row.querySelector('.rect-h').value = rect.h;
      row.querySelector('.rect-yc').value = rect.yc;
    });
  }
  calcFns[section.tab]?.();
  const selected = new Set(Array.isArray(section.selectedResults) ? section.selectedResults : []);
  if (Array.isArray(section.selectedResults)) document.querySelectorAll('.res-cb').forEach((cb, index) => { cb.checked = selected.has(String(lastResults[index]?.[0] || '')); });
  const sourceFingerprint = checked.calculation?.fingerprint || '';
  const replayFingerprint = sectionCalculationFingerprint();
  if (verifyFingerprint) {
    if (!lastResults.length) throw new Error('尺寸資料無法得到有效的斷面性質。');
    const previous = previousSectionEngine(checked);
    const compare = previous ? sectionCalculationFingerprint(checked.calculationEngine) : replayFingerprint;
    if (!(previous && revisedSectionGeometry(section)) && compare !== sourceFingerprint) throw new Error(`重算指紋不符（來源 ${sourceFingerprint}；目前 ${compare}）`);
  }
  return replayFingerprint;
}

function applySectionProjectData(data) {
  const checked = validateSectionProjectData(data);
  const previous = collectSectionProjectData();
  try {
    return applySectionProjectDataUnchecked(checked, true);
  } catch (error) {
    try { applySectionProjectDataUnchecked(previous, false); } catch (_) { /* 保留原畫面可用性 */ }
    throw error;
  }
}

function downloadSectionProject() {
  if (!lastResults.length) { setStatus('請先完成斷面計算', 'warn'); return; }
  const data = collectSectionProjectData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${(lastTitle || '斷面性質').replace(/[\\/:*?"<>|]+/g, '-')}.json`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  setStatus(`案例已儲存；計算指紋 ${data.calculation.fingerprint}`, 'ok');
}

async function loadSectionProjectFile(event) {
  const input = event?.target;
  const file = input?.files?.[0];
  if (!file) return;
  try {
    const data = validateSectionProjectData(JSON.parse(await file.text()));
    const fingerprint = applySectionProjectData(data);
    if (previousSectionEngine(data) && revisedSectionGeometry(data.section)) {
      setStatus(`已核對舊版來源 ${data.calculation.fingerprint}，並依新版幾何重新計算。請核對尺寸、外緣及報表勾選項目後另存。新指紋 ${fingerprint}`, 'warn');
    } else {
      setStatus(`案例已載入並重算；計算指紋 ${fingerprint}`, 'ok');
    }
  } catch (error) {
    setStatus(`載入失敗：${error.message || error}`, 'error');
  } finally {
    input.value = '';
  }
}

function collectReportInputRows() {
  return [...document.querySelectorAll('#input-panel .form-group')].map(group => {
    const control = group.querySelector('input[id], select[id]');
    if (!control) return null;
    const label = group.querySelector('label')?.textContent?.trim() || control.id || '輸入值';
    let value = control.tagName === 'SELECT'
      ? (control.options[control.selectedIndex]?.text || control.value)
      : control.value;
    if (!value && ['g-cTop','g-cBottom'].includes(control.id)) value = '未提供，該側斷面模數待補';
    return { label, value };
  }).filter(Boolean);
}

function csvCell(val) {
  const s = String(val ?? '');
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCSV() {
  const checked = getCheckedResults();

    ['斷面名稱', lastTitle || '斷面性質', '工具版本', SECTION_TOOL_VERSION],

const COMPARISON_METRIC_KEYS = [
  { key: 'A', label: 'A (斷面積)', unit: 'cm²', match: l => /^\s*A\b/i.test(l) },
  { key: 'W', label: 'W (單位重)', unit: 'kg/m', match: l => /^\s*W\b/i.test(l) },
  { key: 'Ix', label: 'Ix / I (強軸慣性矩)', unit: 'cm⁴', match: l => /^\s*(Ix|I\s*\(|I$)/i.test(l) && !/Iy|參考軸|底邊軸|下底軸|尖端軸/i.test(l) },
  { key: 'Iy', label: 'Iy (弱軸慣性矩)', unit: 'cm⁴', match: l => /^\s*Iy\b/i.test(l) },
  { key: 'Sx', label: 'Sx / S (強軸斷面模數)', unit: 'cm³', match: l => /^\s*(Sx|S\s*\(|S$|Sx \(控制\)|Sx_bot)/i.test(l) && !/Sy/i.test(l) },
  { key: 'Sy', label: 'Sy (弱軸斷面模數)', unit: 'cm³', match: l => /^\s*Sy\b/i.test(l) },
  { key: 'Zx', label: 'Zx / Z (強軸塑性模數)', unit: 'cm³', match: l => /^\s*(Zx|Z\s*\(|Z$)/i.test(l) && !/Zy/i.test(l) },
  { key: 'Zy', label: 'Zy (弱軸塑性模數)', unit: 'cm³', match: l => /^\s*Zy\b/i.test(l) },
  { key: 'rx', label: 'rx / r (強軸迴轉半徑)', unit: 'cm', match: l => /^\s*(rx|r\s*\(|r$|r_cg)/i.test(l) && !/ry|rT|r₁|r₂|r_tip/i.test(l) },
  { key: 'ry', label: 'ry (弱軸迴轉半徑)', unit: 'cm', match: l => /^\s*ry\b/i.test(l) },
];

let comparisonItems = [];

function extractComparisonMetrics(results) {
  const map = {};
  COMPARISON_METRIC_KEYS.forEach(m => {
    const governing = m.key === 'Sx' ? results.find(([label]) => label === 'Sx (控制)') : null;
    if (m.key === 'Sx' && !governing) {
      const sides = results.filter(([label, value]) => /^Sx_(top|bot)$/.test(label) && Number.isFinite(value));
      if (sides.length === 2) {
        map[m.key] = Math.min(...sides.map(([, value]) => value));
        return;
      }
    }
    const found = governing || results.find(([label]) => m.match(String(label)));
    map[m.key] = found ? Number(found[1]) : null;
  });
  return map;
}

function addCurrentToComparison() {
  if (!lastResults.length) { setStatus('請先完成斷面計算再加入比較', 'warn'); return; }
  if (comparisonItems.length >= 4) {
    setStatus('比較清單最多容納 4 組斷面方案；請先移除或清空現有方案', 'warn');
    return;
  }
  const fp = sectionCalculationFingerprint();
  const dims = collectReportInputRows()
    .filter(r => !/標準規格選擇|選擇斷面類型/.test(r.label))
    .map(r => `${r.label.split(' - ')[0].trim()}=${r.value}`)
    .slice(0, 5)
    .join(', ');
  comparisonItems.push({
    title: lastTitle || '斷面方案',
    dims,
    fingerprint: fp,
    metrics: extractComparisonMetrics(lastResults),
  });
  renderComparisonTable();
  setStatus(`已將「${lastTitle}」加入方案並排比較（目前 ${comparisonItems.length} / 4 組）`, 'ok');
}

function removeComparisonItem(index) {
  comparisonItems.splice(index, 1);
  renderComparisonTable();
}

function clearComparison() {
  comparisonItems = [];
  renderComparisonTable();
  setStatus('已清空斷面方案比較表', 'ok');
}

function formatDeltaBadge(val, baseVal) {
  if (val == null || baseVal == null || !Number.isFinite(val) || !Number.isFinite(baseVal) || baseVal === 0) return '';
  const pct = ((val - baseVal) / Math.abs(baseVal)) * 100;
  if (Math.abs(pct) < 0.05) return `<span class="comp-delta zero">0.0%</span>`;
  const sign = pct > 0 ? '+' : '';
  const cls = pct > 0 ? 'pos' : 'neg';
  return `<span class="comp-delta ${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function renderComparisonTable() {
  const card = document.getElementById('comparisonCard');
  const wrap = document.getElementById('comparisonTableWrap');
  const badge = document.getElementById('comparisonCountBadge');
  if (!card || !wrap) return;
  if (!comparisonItems.length) {
    card.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  card.style.display = 'block';
  if (badge) badge.textContent = `(${comparisonItems.length} / 4 組，以方案 1 為基準對照百分比變化)`;
  const base = comparisonItems[0].metrics;
  const headers = comparisonItems.map((item, idx) =>
    `<th><div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;"><span>方案 ${idx + 1}：${escapeHtml(item.title)}</span><button type="button" onclick="removeComparisonItem(${idx})" title="移除此方案" style="border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:1em;">✕</button></div><div style="font-size:0.75em;font-weight:400;color:#64748b;margin-top:2px;">${escapeHtml(item.dims)}</div></th>`
  ).join('');
  const bodyRows = COMPARISON_METRIC_KEYS.map(m => {
    if (comparisonItems.every(item => item.metrics[m.key] == null)) return '';
    const cells = comparisonItems.map((item, idx) => {
      const v = item.metrics[m.key];
      if (v == null || !Number.isFinite(v)) return `<td class="num" style="color:#94a3b8;">—</td>`;
      const delta = idx === 0 ? '' : formatDeltaBadge(v, base[m.key]);
      return `<td class="num">${fmt(v)}${delta}</td>`;
    }).join('');
    return `<tr><td>${escapeHtml(m.label)} <span style="font-size:0.8em;color:#94a3b8;">(${m.unit})</span></td>${cells}</tr>`;
  }).filter(Boolean).join('');
  wrap.innerHTML = `<table class="comp-table"><thead><tr><th>斷面性質項目</th>${headers}</tr></thead><tbody>${bodyRows}</tbody></table>`;
}

async function copyComparisonTSV() {
  if (!comparisonItems.length) { setStatus('比較表尚無方案資料', 'warn'); return; }
  const base = comparisonItems[0].metrics;
  const headerRow = ['斷面性質', '單位', ...comparisonItems.map((item, idx) => `方案 ${idx + 1}: ${item.title} (${item.dims})`)].join('\t');
  const rows = [headerRow];
  COMPARISON_METRIC_KEYS.forEach(m => {
    if (comparisonItems.every(item => item.metrics[m.key] == null)) return;
    const cols = [m.label, m.unit];
    comparisonItems.forEach((item, idx) => {
      const v = item.metrics[m.key];
      if (v == null || !Number.isFinite(v)) { cols.push('—'); return; }
      if (idx === 0 || base[m.key] == null || base[m.key] === 0) {
        cols.push(String(fmt(v)));
      } else {
        const pct = ((v - base[m.key]) / Math.abs(base[m.key])) * 100;
        const sign = pct > 0 ? '+' : '';
        cols.push(`${fmt(v)} (${sign}${pct.toFixed(1)}%)`);
      }
    });
    rows.push(cols.join('\t'));
  });
  await copySectionText(rows.join('\n'), `已複製 ${comparisonItems.length} 組斷面方案比較表 (TSV)，可直接貼入 Excel 或報告`);
}

function encodeSharePayload(obj) {
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeSharePayload(token) {
  const b64 = String(token).replace(/-/g, '+').replace(/_/g, '/');
  const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
  const bin = atob(b64 + pad);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

async function copyShareLink() {
  if (!lastResults.length) { setStatus('請先完成斷面計算', 'warn'); return; }
  const source = collectSectionInputs();
  const payload = { t: currentTab, i: source.inputs, c: source.custom };
  const token = encodeSharePayload(payload);
  const url = new URL(window.location.href);
  url.hash = `share=${token}`;
  if (window.history?.replaceState) window.history.replaceState(null, '', url.href);
  await copySectionText(url.href, `已複製斷面分享連結（含目前尺寸參數，計算指紋 ${sectionCalculationFingerprint()}）`);
}

function restoreFromShareHash() {
  const hash = String(window.location.hash || '');
  if (!hash.startsWith('#share=')) return false;
  const previous = collectSectionProjectData();
  try {
    const token = hash.slice('#share='.length);
    if (token.length > 32000) throw new Error('分享連結長度超出限制');
    const payload = decodeSharePayload(token);
    const section = { tab: payload?.t, inputs: payload?.i, custom: payload?.c };
    validateSectionInputData(section);
    const fingerprint = applySectionProjectDataUnchecked({ section }, false);
    if (!lastResults.length) throw new Error('斷面尺寸無法計算');
    setStatus(`已從分享連結還原「${lastTitle}」斷面尺寸（計算指紋 ${fingerprint}）`, 'ok');
    return true;
  } catch (e) {
    applySectionProjectDataUnchecked(previous, false);
    setStatus('分享連結內的斷面資料無法還原。', 'warn');
    return false;
  }
}

  const dpr = 2;
  const out = document.createElement('canvas');

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, totalW, totalH);

let _lastDrawFn = null;
let _lastAccessibleLabel = '斷面計算示意圖';
let _axesQueue = [];
let _dimQueue = [];
let _inDrawSection = false;

function redrawSectionCard() {
  if (_lastDrawFn) drawSection(_lastDrawFn, _lastAccessibleLabel);
}

function drawSection(fn, accessibleLabel = '斷面計算示意圖') {
  _lastDrawFn = fn;
  _lastAccessibleLabel = accessibleLabel;
  const c = document.getElementById('sectionCanvas'), ctx = c.getContext('2d');
  c.setAttribute('role', 'img');
  c.setAttribute('aria-label', accessibleLabel);
  const W = 680, H = 310, plotW = 390, plotH = 310, dpr = 2;
  if (typeof ctx.scale === 'function') {
    c.width = W * dpr;
    c.height = H * dpr;
    if (c.style) { c.style.width = `${W}px`; c.style.height = `${H}px`; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  ctx.clearRect(0, 0, W, H);
  // Layer 1: Engineering grid paper background + Section geometry
  if (typeof ctx.fillRect === 'function' && typeof ctx.strokeRect === 'function') {
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 20; x < plotW; x += 20) { ctx.moveTo(x, 0); ctx.lineTo(x, plotH); }
    for (let y = 20; y < plotH; y += 20) { ctx.moveTo(0, y); ctx.lineTo(plotW, y); }
    ctx.stroke();
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, plotW - 1, plotH - 1);
    ctx.restore();
  }
  _axesQueue = [];
  _dimQueue = [];
  _inDrawSection = true;
  fn(ctx, plotW, plotH);
  _inDrawSection = false;

  // Layer 2: Centroidal Principal Axes (drawn AFTER geometry, BEFORE dimensions)
  _axesQueue.forEach(ax => _renderAxesNow(ax.ctx, ax.cx, ax.cy, ax.len, _dimQueue, plotW, plotH));

  // Layer 3: Dimension lines & Non-overlapping Opaque Pill Badges (Topmost layer)
  _renderDimsNow(ctx, _dimQueue, _axesQueue, plotW, plotH);

  // Right Column: Engineering Specification & Section Properties Summary Card
  if (typeof ctx.fillRect === 'function' && typeof ctx.fillText === 'function') {
    _renderSectionSpecCard(ctx, plotW + 6, 0, W - plotW - 6, H);
  }
}

function drawAxes(ctx, cx, cy, len) {
  if (_inDrawSection) {
    _axesQueue.push({ ctx, cx, cy, len });
    return;
  }
  _renderAxesNow(ctx, cx, cy, len, [], 390, 310);
}

function _renderAxesNow(ctx, cx, cy, len, dims, plotW, plotH) {
  ctx.save();
  const x1 = Math.max(12, cx - len), x2 = Math.min(plotW - 18, cx + len);
  const y1 = Math.max(18, cy - len), y2 = Math.min(plotH - 12, cy + len);
  ctx.setLineDash([5, 3]);
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 1.25;
  ctx.beginPath(); ctx.moveTo(x1, cy); ctx.lineTo(x2, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, y1); ctx.lineTo(cx, y2); ctx.stroke();
  ctx.setLineDash([]);
  // Centroid marker & principal axis labels
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, PI * 2); ctx.fill();
  ctx.font = 'italic bold 11px "Segoe UI", Consolas, sans-serif';
  // Check if right end 'x' or top end 'y' is near any dimension text
  let xLabelX = x2 + 4, xLabelY = cy + 4;
  const xNearDim = dims.some(d => Math.abs(d.x - xLabelX) < 32 && Math.abs(d.y - xLabelY) < 16);
  if (xNearDim) { xLabelY = cy - 6; }
  ctx.textAlign = 'left';
  ctx.fillText('x', xLabelX, xLabelY);

  let yLabelX = cx, yLabelY = y1 - 5;
  const yNearDim = dims.some(d => Math.abs(d.x - yLabelX) < 34 && Math.abs(d.y - yLabelY) < 16);
  if (yNearDim) { yLabelX = cx + 10; yLabelY = y1 + 8; }
  ctx.textAlign = 'center';
  ctx.fillText('y', yLabelX, yLabelY);
  ctx.restore();
}

function dimText(ctx, txt, x, y, opts = null) {
  if (_inDrawSection) {
    _dimQueue.push({ ctx, txt: String(txt), x, y, opts });
    return;
  }
  _renderSingleDimPill(ctx, String(txt), x, y, '#0f172a', '#94a3b8');
}

function drawDimH(ctx, x1, x2, yLine, txt) {
  const mx = (x1 + x2) / 2;
  dimText(ctx, txt, mx, yLine + 4, { type: 'H', x1, x2, yLine });
}

function drawDimV(ctx, xLine, y1, y2, txt) {
  const my = (y1 + y2) / 2;
  dimText(ctx, txt, xLine, my + 4, { type: 'V', xLine, y1, y2 });
}

function _renderSingleDimPill(ctx, txt, x, y, textColor = '#0f172a', borderColor = '#94a3b8') {
  ctx.save();
  ctx.font = 'bold 11.5px "Segoe UI", "Microsoft JhengHei", Consolas, sans-serif';
  ctx.textAlign = 'center';
  const w = (typeof ctx.measureText === 'function' ? ctx.measureText(txt).width : txt.length * 7) + 10;
  const h = 16;
  const rx = x - w / 2, ry = y - 12;
  ctx.fillStyle = '#ffffff';
  if (typeof ctx.roundRect === 'function') {
    ctx.beginPath(); ctx.roundRect(rx, ry, w, h, 4); ctx.fill();
    ctx.strokeStyle = borderColor; ctx.lineWidth = 1; ctx.stroke();
  } else {
    ctx.fillRect(rx, ry, w, h);
    if (typeof ctx.strokeRect === 'function') {
      ctx.strokeStyle = borderColor; ctx.lineWidth = 1; ctx.strokeRect(rx, ry, w, h);
    }
  }
  ctx.fillStyle = textColor;
  ctx.fillText(txt, x, y);
  ctx.restore();
  return { x: rx, y: ry, w, h, cx: x, cy: y };
}

function _renderDimsNow(ctx, dims, axes, plotW, plotH) {
  const placedBoxes = [];
  dims.forEach(d => {
    // Draw dimension leader / witness line first if specified
    if (d.opts && d.opts.type === 'H') {
      const { x1, x2, yLine } = d.opts;
      ctx.save();
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, yLine); ctx.lineTo(x2, yLine);
      ctx.moveTo(x1, yLine - 3.5); ctx.lineTo(x1, yLine + 3.5);
      ctx.moveTo(x2, yLine - 3.5); ctx.lineTo(x2, yLine + 3.5);
      ctx.stroke();
      ctx.restore();
    } else if (d.opts && d.opts.type === 'V') {
      const { xLine, y1, y2 } = d.opts;
      ctx.save();
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xLine, y1); ctx.lineTo(xLine, y2);
      ctx.moveTo(xLine - 3.5, y1); ctx.lineTo(xLine + 3.5, y1);
      ctx.moveTo(xLine - 3.5, y2); ctx.lineTo(xLine + 3.5, y2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.font = 'bold 11.5px "Segoe UI", "Microsoft JhengHei", Consolas, sans-serif';
    const w = (typeof ctx.measureText === 'function' ? ctx.measureText(d.txt).width : d.txt.length * 7) + 10;
    const h = 16;
    ctx.restore();

    let px = d.x, py = d.y;
    // Clamp within plot area with safe margin
    px = Math.max(w / 2 + 4, Math.min(plotW - w / 2 - 4, px));
    py = Math.max(15, Math.min(plotH - 6, py));

    // Avoid sitting directly on centroid red dot if not C.G. label
    if (!/C\.G\./i.test(d.txt)) {
      axes.forEach(ax => {
        if (Math.abs(px - ax.cx) < w / 2 + 4 && Math.abs((py - 4) - ax.cy) < 10) {
          py += (py >= ax.cy ? 12 : -12);
        }
      });
    }

    // 2D collision avoidance against previously placed dimension badges
    for (let attempt = 0; attempt < 6; attempt++) {
      const rx = px - w / 2, ry = py - 12;
      const hit = placedBoxes.find(b => !(rx + w + 2 < b.x || rx - 2 > b.x + b.w || ry + h + 2 < b.y || ry - 2 > b.y + b.h));
      if (!hit) break;
      if (py >= plotH / 2) {
        py = Math.min(plotH - 6, hit.y + hit.h + 14);
      } else {
        py = Math.max(15, hit.y - 5);
      }
    }

    const isCg = /C\.G\./i.test(d.txt);
    const box = _renderSingleDimPill(d.ctx, d.txt, px, py, isCg ? '#b91c1c' : '#0f172a', isCg ? '#fca5a5' : '#94a3b8');
    placedBoxes.push(box);
  });
}

function _renderSectionSpecCard(ctx, x0, y0, cardW, cardH) {
  ctx.save();
  // Card frame
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(x0, y0, cardW, cardH);
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  ctx.strokeRect(x0 + 0.5, y0 + 0.5, cardW - 1, cardH - 1);

  // Top header banner
  const hdrH = 44;
  ctx.fillStyle = '#1e3a5f';
  ctx.fillRect(x0, y0, cardW, hdrH);
  ctx.fillStyle = '#93c5fd';
  ctx.font = 'bold 10px "Microsoft JhengHei", "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('斷面規格與性質參數卡 (單位: 尺寸 mm｜性質 cm)', x0 + 10, y0 + 15);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12.5px "Microsoft JhengHei", "Segoe UI", sans-serif';
  const titleStr = String(lastTitle || '斷面性質計算');
  ctx.fillText(titleStr.length > 24 ? titleStr.slice(0, 23) + '…' : titleStr, x0 + 10, y0 + 34);

  // Dimensions strip
  const dimBarY = y0 + hdrH;
  const dimBarH = 26;
  ctx.fillStyle = '#eff6ff';
  ctx.fillRect(x0 + 1, dimBarY, cardW - 2, dimBarH);
  ctx.strokeStyle = '#bfdbfe';
  ctx.beginPath(); ctx.moveTo(x0, dimBarY + dimBarH); ctx.lineTo(x0 + cardW, dimBarY + dimBarH); ctx.stroke();

  let dimParts = [];
  if (typeof collectReportInputRows === 'function') {
    dimParts = collectReportInputRows()
      .filter(r => !/標準規格選擇|選擇斷面類型/.test(r.label) && !/未提供/.test(r.value))
      .map(r => `${r.label.split(' - ')[0].split(' (')[0].trim()}=${r.value}`);
  }
  if (currentTab === 'custom') {
    const nRects = document.querySelectorAll('#custom-rects .custom-rect-row').length;
    dimParts = [`共 ${nRects} 個矩形組合斷面`];
  }
  const dimSummary = dimParts.length ? `尺寸: ${dimParts.slice(0, 6).join(' ｜ ')}` : '尺寸: 依左側輸入參數';
  ctx.fillStyle = '#1e40af';
  ctx.font = 'bold 10px Consolas, "Microsoft JhengHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(dimSummary.length > 44 ? dimSummary.slice(0, 43) + '…' : dimSummary, x0 + 8, dimBarY + 17);

  // Properties 2-column grid
  const checked = (typeof getCheckedResults === 'function' ? getCheckedResults() : []);
  const sourceItems = checked.length ? checked : (lastResults || []);
  const displayItems = sourceItems.slice(0, 14);
  const gridTop = dimBarY + dimBarH + 6;
  const cols = 2;
  const colW = (cardW - 16) / cols;
  const rowH = 30;

  displayItems.forEach(([l, v, u], idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const gx = x0 + 6 + col * (colW + 4);
    const gy = gridTop + row * rowH;
    if (gy + rowH > y0 + cardH - 18) return;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(gx, gy, colW, rowH - 3);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(gx, gy, colW, rowH - 3);
    ctx.fillStyle = '#1e3a5f';
    ctx.fillRect(gx, gy, 2.5, rowH - 3);

    const shortLabel = String(l).split(' (')[0].trim();
    ctx.fillStyle = '#475569';
    ctx.font = 'bold 10.5px "Segoe UI", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(shortLabel.length > 10 ? shortLabel.slice(0, 9) + '…' : shortLabel, gx + 6, gy + 17);

    const valStr = String(fmt(v));
    const unitStr = String(u || '');
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 11px Consolas, monospace';
    ctx.textAlign = 'right';
    const unitOffset = unitStr ? 26 : 5;
    ctx.fillText(valStr, gx + colW - unitOffset, gy + 17);

    if (unitStr) {
      ctx.fillStyle = '#64748b';
      ctx.font = '9.5px Consolas, "Microsoft JhengHei", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(unitStr, gx + colW - 24, gy + 17);
    }
  });

  // Footer bar with version & fingerprint
  let fp = '';
  try { fp = typeof sectionCalculationFingerprint === 'function' ? sectionCalculationFingerprint() : ''; } catch (_) {}
  ctx.fillStyle = '#64748b';
  ctx.font = '9.5px Consolas, "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`工具版本 ${SECTION_TOOL_VERSION}`, x0 + 8, y0 + cardH - 5);
  if (fp) {
    ctx.textAlign = 'right';
    ctx.fillText(fp, x0 + cardW - 8, y0 + cardH - 5);
  }
  ctx.restore();
}

const hSections = Steel.H_SECTIONS_MM;

function buildHSelect(filterText = '') {
  const q = String(filterText || '').trim().toLowerCase().replace(/[×x*]/g, 'x');
  let html = '<option value="">-- 自訂尺寸 --</option>';
  hSections.forEach(g => {
    const matched = [];
    g.s.forEach((s, i) => {
      const normalized = `${s.n} ${g.g}`.toLowerCase().replace(/[×x*]/g, 'x');
      if (!q || normalized.includes(q)) {
        matched.push(`<option value="${g.g}-${i}">${s.n} (R=${s.R})</option>`);
      }
    });
    if (matched.length) {
      html += `<optgroup label="${g.g}">${matched.join('')}</optgroup>`;
    }
  });
  return html;
}

function filterHSelect(inputEl) {
  const sel = document.getElementById('h-select');
  if (!sel) return;
  const currentVal = sel.value;
  sel.innerHTML = buildHSelect(inputEl?.value || '');
  if (currentVal && [...sel.options].some(o => o.value === currentVal)) {
    sel.value = currentVal;
  }
}

function onHSelect() {
  const v = document.getElementById('h-select').value;
  if (!v) return;
  const [gn, idx] = v.split(/-(?=[^-]*$)/);
  const grp = hSections.find(g => g.g === gn);
  if (!grp) return;
  const s = grp.s[parseInt(idx)];
  document.getElementById('h-H').value = s.H;
  document.getElementById('h-B').value = s.B;
  document.getElementById('h-tw').value = s.tw;
  document.getElementById('h-tf').value = s.tf;
  document.getElementById('h-R').value = s.R;
  calcHBeam();
}

// ---------- Solid Rect ----------
function calcSolidRect() {
  const bmm=val('sr-b'),hmm=val('sr-h'); if(!bmm||!hmm) return clearSectionResults();
  const b=bmm/10,h=hmm/10;
  const A=b*h;
  const Ix=b*h**3/12, Iy=h*b**3/12;
  const Sx=b*h**2/6,  Sy=h*b**2/6;
  const rx=h/Math.sqrt(12), ry=b/Math.sqrt(12);
  const Zx=b*h**2/4,  Zy=h*b**2/4;
  // Torsion: Saint-Venant J approximation for solid rectangle
  const rat=Math.min(b,h)/Math.max(b,h); // t/b ratio (short/long)
  const C=1/3*(1-192/PI**5*rat*[...Array(5)].map((_,k)=>{const n=2*k+1;return Math.tanh(n*PI/(2*rat))/n**5;}).reduce((a,v)=>a+v,0));
  const J=C*Math.min(b,h)**3*Math.max(b,h);
  const W=A*0.785;
  showResults([
    ['A (斷面積)',A,'cm²'],['W (單位重)',W,'kg/m'],
    ['Ix (強軸慣性矩)',Ix,'cm⁴'],['Iy (弱軸慣性矩)',Iy,'cm⁴'],
    ['Sx (強軸斷面模數)',Sx,'cm³'],['Sy (弱軸斷面模數)',Sy,'cm³'],
    ['rx (強軸迴轉半徑)',rx,'cm'],['ry (弱軸迴轉半徑)',ry,'cm'],
    ['Zx (強軸塑性模數)',Zx,'cm³'],['Zy (弱軸塑性模數)',Zy,'cm³'],
    ['J (扭轉常數)',J,'cm⁴'],['b/h 寬高比',bmm/hmm,''],
  ]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/bmm,(H-80)/hmm),sw=bmm*sc,sh=hmm*sc,ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.fillRect(ox,oy,sw,sh);ctx.strokeRect(ox,oy,sw,sh);
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`b = ${bmm} mm`);
    drawDimV(ctx,ox-26,oy,oy+sh,`h = ${hmm}`);
    drawAxes(ctx,ox+sw/2,oy+sh/2,Math.max(sw,sh)/2+16);
  });
}

// ---------- Solid Circle ----------
function calcSolidCircle() {
  const Dmm=val('sc-d'); if(!Dmm) return clearSectionResults();
  const D=Dmm/10,r=D/2;
  const A=PI*r**2;
  const I=PI*D**4/64;
  const S=PI*D**3/32;
  const rg=D/4;
  const Z=D**3/6;
  const J=PI*D**4/32;
  const W=A*0.785;
  showResults([
    ['A (斷面積)',A,'cm²'],['W (單位重)',W,'kg/m'],
    ['I (慣性矩 Ix=Iy)',I,'cm⁴'],
    ['S (斷面模數)',S,'cm³'],
    ['r (迴轉半徑)',rg,'cm'],
    ['Z (塑性模數)',Z,'cm³'],
    ['J (極慣性矩/扭轉)',J,'cm⁴'],
    ['D (直徑)',D,'cm'],
  ]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/Dmm,(H-80)/Dmm),sr=Dmm/2*sc,cx=W/2,cy=H/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,sr,0,PI*2);ctx.fill();ctx.stroke();
    drawDimH(ctx,cx-sr,cx+sr,cy+sr+22,`D = ${Dmm} mm`);
    drawAxes(ctx,cx,cy,sr+16);
  });
}

// ---------- H-Beam ----------
function calcHBeam() {
  const Hmm=val('h-H'),Bmm=val('h-B'),tw=val('h-tw'),tf=val('h-tf'),R=val('h-R');
  if (Hmm <= 0 || Bmm <= 0 || tw <= 0 || tf <= 0 || 2 * tf >= Hmm || tw > Bmm) return clearSectionResults();
  const H=Hmm/10,B=Bmm/10,twc=tw/10,tfc=tf/10,Rc=R/10;
  const hw=H-2*tfc;
  let A=2*B*tfc+hw*twc;
  let Ix=2*(B*tfc**3/12+B*tfc*((H-tfc)/2)**2)+twc*hw**3/12;
  let Iy=2*tfc*B**3/12+hw*twc**3/12;
  let Zx=2*(B*tfc*(H/2-tfc/2)+twc*(hw/2)*(hw/4));
  let Zy=2*tfc*B**2/4+hw*twc**2/4;
  // Fillet correction
  if(Rc>0){
    const Af=Rc**2*(1-PI/4), yf=Rc/(6*(1-PI/4));
    const Ic=Rc**4*(16-3*PI)/48, Io=Ic-Af*yf**2;
    // yf 為圓角形心距圓弧圓心；形心距翼板內面／腹板面 = Rc−yf (≈0.2234R)
    const dx=(H/2-tfc)-(Rc-yf), dy=twc/2+(Rc-yf);
    A+=4*Af; Ix+=4*(Io+Af*dx**2); Iy+=4*(Io+Af*dy**2); Zx+=4*Af*dx; Zy+=4*Af*dy;
  }
  const Sx=Ix/(H/2),Sy=Iy/(B/2),rx=Math.sqrt(Ix/A),ry=Math.sqrt(Iy/A);
  const Avx=hw*twc,Avy=2*B*tfc,J=(2*B*tfc**3+hw*twc**3)/3,Cw=Iy*(H-tfc)**2/4,W=A*0.785;
  const hw6=hw/6,ArT=B*tfc+hw6*twc,IyrT=tfc*B**3/12+hw6*twc**3/12,rT=Math.sqrt(IyrT/ArT); // 受壓翼板 + 1/3 受壓腹板 (hw/2)/3
  showResults([['A (斷面積)',A,'cm²'],['W (單位重)',W,'kg/m'],['Ix (強軸慣性矩)',Ix,'cm⁴'],['Iy (弱軸慣性矩)',Iy,'cm⁴'],['Sx (強軸斷面模數)',Sx,'cm³'],['Sy (弱軸斷面模數)',Sy,'cm³'],['rx (強軸迴轉半徑)',rx,'cm'],['ry (弱軸迴轉半徑)',ry,'cm'],['Zx (強軸塑性模數)',Zx,'cm³'],['Zy (弱軸塑性模數)',Zy,'cm³'],['Avx (腹板剪力面積)',Avx,'cm²'],['Avy (翼板剪力面積)',Avy,'cm²'],['J (扭轉常數)',J,'cm⁴'],['Cw (翹曲常數)',Cw,'cm⁶'],['rT',rT,'cm'],['翼板寬厚比 B/(2tf)',Bmm/(2*tf),''],['腹板寬厚比 h/tw',(Hmm-2*tf)/tw,'']]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-120)/Bmm,(H-84)/Hmm),sw=Bmm*sc,sh=Hmm*sc,ox=(W-sw)/2,oy=(H-sh)/2,stw=Math.max(2,tw*sc),stf=Math.max(2,tf*sc);
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+sw,oy);ctx.lineTo(ox+sw,oy+stf);ctx.lineTo(ox+sw/2+stw/2,oy+stf);ctx.lineTo(ox+sw/2+stw/2,oy+sh-stf);ctx.lineTo(ox+sw,oy+sh-stf);ctx.lineTo(ox+sw,oy+sh);ctx.lineTo(ox,oy+sh);ctx.lineTo(ox,oy+sh-stf);ctx.lineTo(ox+sw/2-stw/2,oy+sh-stf);ctx.lineTo(ox+sw/2-stw/2,oy+stf);ctx.lineTo(ox,oy+stf);ctx.closePath();ctx.fill();ctx.stroke();
    drawDimV(ctx,ox-26,oy,oy+sh,`H=${Hmm}`);
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`B=${Bmm} mm`);
    dimText(ctx,`tw=${tw}, tf=${tf}`,ox+sw/2+stw/2+44,oy+sh/2-18);
    drawAxes(ctx,ox+sw/2,oy+sh/2,Math.max(sw,sh)/2+16);
  });
}

// ---------- Pipe ----------
function calcPipe() {
  const D=val('p-D'),t=val('p-t'); if (D <= 0 || t <= 0 || 2 * t >= D) return clearSectionResults();
  const Dc=D/10,tc=t/10,d=Dc-2*tc;
  const A=PI/4*(Dc**2-d**2),I=PI/64*(Dc**4-d**4),S=I/(Dc/2),r=Math.sqrt(I/A),Z=(Dc**3-d**3)/6,J=PI/32*(Dc**4-d**4);
  showResults([['A',A,'cm²'],['W',A*0.785,'kg/m'],['I (慣性矩)',I,'cm⁴'],['S (斷面模數)',S,'cm³'],['r (迴轉半徑)',r,'cm'],['Z (塑性模數)',Z,'cm³'],['J (扭轉常數)',J,'cm⁴']]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/D,(H-84)/D),sr=D/2*sc,sir=Math.max(2,(D/2-t)*sc),cx=W/2,cy=H/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,sr,0,PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(cx,cy,sir,0,PI*2);ctx.fill();ctx.stroke();
    drawDimH(ctx,cx-sr,cx+sr,cy+sr+22,`D = ${D} mm`);
    dimText(ctx,`t = ${t} mm`,cx+sr+34,cy-sr/2);
    drawAxes(ctx,cx,cy,sr+16);
  });
}

// ---------- Box ----------
function calcBox() {
  const X=val('b-X'),Y=val('b-Y'),t=val('b-t'); if(!X||!Y||!t) return clearSectionResults();
  const Xc=X/10,Yc=Y/10,tc=t/10,Xi=Xc-2*tc,Yi=Yc-2*tc;
  const A=Xc*Yc-Xi*Yi,Ix=(Xc*Yc**3-Xi*Yi**3)/12,Iy=(Yc*Xc**3-Yi*Xi**3)/12;
  showResults([['A',A,'cm²'],['W',A*0.785,'kg/m'],['Ix',Ix,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx',Ix/(Yc/2),'cm³'],['Sy',Iy/(Xc/2),'cm³'],['rx',Math.sqrt(Ix/A),'cm'],['ry',Math.sqrt(Iy/A),'cm']]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-120)/X,(H-84)/Y),sw=X*sc,sh=Y*sc,st=Math.max(2,t*sc),ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.fillRect(ox,oy,sw,sh);ctx.strokeRect(ox,oy,sw,sh);
    ctx.fillStyle='#f8fafc';ctx.fillRect(ox+st,oy+st,sw-2*st,sh-2*st);ctx.strokeRect(ox+st,oy+st,sw-2*st,sh-2*st);
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`X = ${X} mm`);
    drawDimV(ctx,ox-26,oy,oy+sh,`Y = ${Y}`);
    dimText(ctx,`t = ${t} mm`,ox+sw+32,oy+22);
    drawAxes(ctx,ox+sw/2,oy+sh/2,Math.max(sw,sh)/2+16);
  });
}

// ---------- Angle ----------
function calcAngle() {
  const X=val('a-X'),Y=val('a-Y'),t=val('a-t'); if(!X||!Y||!t) return clearSectionResults();
  const Xc=X/10,Yc=Y/10,tc=t/10;
  const A1=Xc*tc,A2=(Yc-tc)*tc,A=A1+A2;
  const Cy=(A1*tc/2+A2*(tc+(Yc-tc)/2))/A, Cx=(A1*Xc/2+A2*tc/2)/A;
  const Ix=Xc*tc**3/12+A1*(Cy-tc/2)**2+tc*(Yc-tc)**3/12+A2*(tc+(Yc-tc)/2-Cy)**2;
  const Iy=tc*Xc**3/12+A1*(Cx-Xc/2)**2+(Yc-tc)*tc**3/12+A2*(Cx-tc/2)**2;
  showResults([['A',A,'cm²'],['Ix',Ix,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx',Ix/Math.max(Cy,Yc-Cy),'cm³'],['Sy',Iy/Math.max(Cx,Xc-Cx),'cm³'],['rx',Math.sqrt(Ix/A),'cm'],['ry',Math.sqrt(Iy/A),'cm'],['Cy (形心距底)',Cy,'cm'],['Cx (形心距左)',Cx,'cm']]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-120)/X,(H-84)/Y),sw=X*sc,sh=Y*sc,st=Math.max(3,t*sc),ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox,oy+sh);ctx.lineTo(ox+sw,oy+sh);ctx.lineTo(ox+sw,oy+sh-st);ctx.lineTo(ox+st,oy+sh-st);ctx.lineTo(ox+st,oy);ctx.lineTo(ox,oy);ctx.closePath();ctx.fill();ctx.stroke();
    const cxp=ox+Cx/Xc*sw,cyp=oy+sh-Cy/Yc*sh;
    drawAxes(ctx,cxp,cyp,Math.max(sw,sh)*0.65);
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`X = ${X} mm`);
    drawDimV(ctx,ox-26,oy,oy+sh,`Y = ${Y}`);
    dimText(ctx,`t = ${t} mm`,ox+sw-20,oy+sh-st-12);
    dimText(ctx,`C.G. (${fmt(Cx)}, ${fmt(Cy)} cm)`,cxp+54,cyp-14);
  });
}

// ---------- Channel ----------
function calcChannel() {
  const Hmm=val('c-H'),Bmm=val('c-B'),tw=val('c-tw'),tf=val('c-tf'); if(!Hmm||!Bmm||!tw||!tf) return clearSectionResults();
  const H=Hmm/10,B=Bmm/10,twc=tw/10,tfc=tf/10,hw=H-2*tfc;
  const A=2*B*tfc+hw*twc, Cy=(hw*twc*twc/2+2*B*tfc*B/2)/A;
  const Ix=twc*hw**3/12+2*(B*tfc**3/12+B*tfc*((H-tfc)/2)**2);
  const Iy=hw*twc**3/12+hw*twc*(Cy-twc/2)**2+2*(tfc*B**3/12+B*tfc*(B/2-Cy)**2);
  showResults([['A',A,'cm²'],['Ix',Ix,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx',Ix/(H/2),'cm³'],['Sy',Iy/Math.max(Cy,B-Cy),'cm³'],['rx',Math.sqrt(Ix/A),'cm'],['ry',Math.sqrt(Iy/A),'cm'],['Cy (形心距腹板)',Cy,'cm']]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-120)/Bmm,(H-84)/Hmm),sw=Bmm*sc,sh=Hmm*sc,stw=Math.max(2,tw*sc),stf=Math.max(2,tf*sc),ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+sw,oy);ctx.lineTo(ox+sw,oy+stf);ctx.lineTo(ox+stw,oy+stf);ctx.lineTo(ox+stw,oy+sh-stf);ctx.lineTo(ox+sw,oy+sh-stf);ctx.lineTo(ox+sw,oy+sh);ctx.lineTo(ox,oy+sh);ctx.closePath();ctx.fill();ctx.stroke();
    const cxp=ox+Cy/B*sw,cyp=oy+sh/2;
    drawAxes(ctx,cxp,cyp,Math.max(sw,sh)/2+16);
    drawDimV(ctx,ox-26,oy,oy+sh,`H=${Hmm}`);
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`B=${Bmm} mm`);
    dimText(ctx,`tw=${tw}, tf=${tf}`,ox+sw+42,oy+sh/2-18);
  });
}

// ---------- C-Channel ----------
function calcCChannel() {
  const Hmm=val('cc-H'),Bmm=val('cc-B'),Cmm=val('cc-C'),tmm=val('cc-t'); if(!Hmm||!Bmm||!tmm) return clearSectionResults();
  const H=Hmm/10,B=Bmm/10,C=Cmm/10,t=tmm/10,hc=H-t,bc=B-t,cc=C-t/2;
  const Aw=hc*t,Af=2*bc*t,Al=2*cc*t,A=Aw+Af+Al;
  const xw=t/2,xf=t/2+bc/2,xl=t/2+bc,Cy=(Aw*xw+Af*xf+Al*xl)/A; // 中心線模型：翼板 t/2→B−t/2，唇緣中心線 x=B−t/2
  const Ix=t*hc**3/12+2*(bc*t**3/12+bc*t*(hc/2)**2)+2*(t*cc**3/12+cc*t*((hc-cc)/2)**2);
  const Iy=hc*t**3/12+Aw*(Cy-xw)**2+2*(t*bc**3/12+bc*t*(xf-Cy)**2)+2*(cc*t**3/12+cc*t*(xl-Cy)**2);
  showResults([['A',A,'cm²'],['W',A*0.785,'kg/m'],['Cy',Cy,'cm'],['Ix',Ix,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx',Ix/(H/2),'cm³'],['Sy',Iy/Math.max(Cy,B-Cy),'cm³'],['rx',Math.sqrt(Ix/A),'cm'],['ry',Math.sqrt(Iy/A),'cm']]);
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-120)/Bmm,(H-84)/Hmm),sh=Hmm*sc,sb=Bmm*sc,scc=Math.max(4,Cmm*sc),st=Math.max(2,tmm*sc),ox=(W-sb)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+sb,oy);ctx.lineTo(ox+sb,oy+scc);ctx.lineTo(ox+sb-st,oy+scc);ctx.lineTo(ox+sb-st,oy+st);ctx.lineTo(ox+st,oy+st);ctx.lineTo(ox+st,oy+sh-st);ctx.lineTo(ox+sb-st,oy+sh-st);ctx.lineTo(ox+sb-st,oy+sh-scc);ctx.lineTo(ox+sb,oy+sh-scc);ctx.lineTo(ox+sb,oy+sh);ctx.lineTo(ox,oy+sh);ctx.closePath();ctx.fill();ctx.stroke();
    const cxp=ox+Cy/B*sb,cyp=oy+sh/2;
    drawAxes(ctx,cxp,cyp,Math.max(sb,sh)/2+16);
    drawDimV(ctx,ox-26,oy,oy+sh,`H=${Hmm}`);
    drawDimH(ctx,ox,ox+sb,oy+sh+22,`B=${Bmm} mm`);
    dimText(ctx,`C=${Cmm}, t=${tmm}`,ox+sb+42,oy+20);
  });
}

// ==================== GEO CALC ====================
function invalidGeometry(message) {
  showResults([]);
  drawSection(() => {}, '尺寸待補');
  setStatus(message, 'warn');
}

function geometryNumber(id) {
  const raw = document.getElementById('g-' + id)?.value.trim();
  return raw ? Number(raw) : NaN;
}

function calcGeo() {
  const el = document.getElementById('geo-type');
  if (!el) return;
  const t = el.value;
  const g = (id) => val('g-'+id);
  let results = [];

  if (t==='rect-c') {
    const b=g('b')/10,h=g('h')/10; if(!b||!h) return clearSectionResults();
    const A=b*h, I=b*h**3/12, S=b*h**2/6, r=h/Math.sqrt(12);
    const Iy=h*b**3/12, Sy=h*b**2/6, ry=b/Math.sqrt(12);
    results=[['A',A,'cm²'],['Ix',I,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx',S,'cm³'],['Sy',Sy,'cm³'],['rx',r,'cm'],['ry',ry,'cm'],['e (形心距)',h/2,'cm']];
    drawGeoRect(g('b'),g('h'),'center');
  } else if (t==='rect-e') {
    const b=g('b')/10,h=g('h')/10; if(!b||!h) return clearSectionResults();
    const A=b*h, I=b*h**3/3, S=b*h**2/3, r=h/Math.sqrt(3);
    results=[['A',A,'cm²'],['I (軸在底邊)',I,'cm⁴'],['S',S,'cm³'],['r',r,'cm'],['e (底邊到頂)',h,'cm']];
    drawGeoRect(g('b'),g('h'),'edge');
  } else if (t==='rect-rot') {
    const b=g('b')/10,h=g('h')/10,th=g('theta')*PI/180; if(!b||!h) return clearSectionResults();
    const A=b*h, ct=Math.cos(th),st=Math.sin(th);
    const I=b*h/12*(h**2*ct**2+b**2*st**2);
    const e=(h*ct+b*st)/2;
    const S=I/e, r=Math.sqrt(I/A);
    results=[['A',A,'cm²'],['I',I,'cm⁴'],['S',S,'cm³'],['r',r,'cm'],['e',e,'cm']];
    drawGeoRotRect(g('b'),g('h'),g('theta'));
  } else if (t==='square-dia') {
    const a=g('a')/10; if(!a) return clearSectionResults();
    const A=a**2, I=a**4/12, e=a/Math.sqrt(2), S=a**3/(6*Math.sqrt(2)), r=a/Math.sqrt(12);
    results=[['A',A,'cm²'],['I',I,'cm⁴'],['S',S,'cm³'],['r',r,'cm'],['e (形心到角)',e,'cm']];
    drawGeoDiamond(g('a'));
  } else if (t==='hollow-rect') {
    const b=g('b')/10,h=g('h')/10,b1=g('b1')/10,h1=g('h1')/10; if(!b||!h||!b1||!h1) return clearSectionResults();
    const A=b*h-b1*h1, Ix=(b*h**3-b1*h1**3)/12, Iy=(h*b**3-h1*b1**3)/12;
    results=[['A',A,'cm²'],['Ix',Ix,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx',Ix/(h/2),'cm³'],['Sy',Iy/(b/2),'cm³'],['rx',Math.sqrt(Ix/A),'cm'],['ry',Math.sqrt(Iy/A),'cm']];
    drawGeoHollowRect(g('b'),g('h'),g('b1'),g('h1'));
  } else if (t==='hollow-rect2') {
    const b=g('b')/10,h=g('h')/10,t2=g('t')/10; if(!b||!h||!t2) return clearSectionResults();
    const bi=b-2*t2,hi=h-2*t2,A=b*h-bi*hi,Ix=(b*h**3-bi*hi**3)/12,Iy=(h*b**3-hi*bi**3)/12;
    results=[['A',A,'cm²'],['Ix',Ix,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx',Ix/(h/2),'cm³'],['Sy',Iy/(b/2),'cm³'],['rx',Math.sqrt(Ix/A),'cm'],['ry',Math.sqrt(Iy/A),'cm']];
    drawGeoHollowRect(g('b'),g('h'),g('b')-2*g('t'),g('h')-2*g('t'));

    drawSection((ctx,W,Hc)=>{const sc=Math.min((W-110)/g('B'),(Hc-80)/g('H')),sB=g('B')*sc,sH=g('H')*sc,sb=g('b')*sc,sh=g('h')*sc,cx=W/2,cy=Hc/2;ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.fillRect(cx-sb/2,cy-sH/2,sb,sH);ctx.strokeRect(cx-sb/2,cy-sH/2,sb,sH);ctx.fillRect(cx-sB/2,cy-sh/2,sB,sh);ctx.strokeRect(cx-sB/2,cy-sh/2,sB,sh);drawDimH(ctx,cx-sB/2,cx+sB/2,cy+sH/2+22,`B=${g('B')}, b=${g('b')}`);drawDimV(ctx,cx-sB/2-26,cy-sH/2,cy+sH/2,`H=${g('H')}`);drawAxes(ctx,cx,cy,Math.max(sB,sH)/2+14);});

  } else if (t==='general') {
    const parts=[];
    for(let i=1;i<=3;i++){
      const Amm2=geometryNumber('A'+i);
      if (Amm2===0) continue;
      const I0mm4=geometryNumber('I'+i), dmm=geometryNumber('d'+i);
      if (!(Amm2>0 && I0mm4>=0 && Number.isFinite(dmm))) return invalidGeometry(`請補齊第 ${i} 組面積、形心慣性矩與有號位置。未使用組請將面積填 0。`);
      parts.push({index:i,A:Amm2/100,I:I0mm4/10000,d:dmm/10,Amm2,I0mm4,dmm});
    }
    if(!parts.length) return invalidGeometry('至少須有一個有效子斷面。');
    const A=parts.reduce((s,p)=>s+p.A,0);
    const center=parts.reduce((s,p)=>s+p.A*p.d,0)/A;
    const I=parts.reduce((s,p)=>s+p.I+p.A*(p.d-center)**2,0);
    results=[['A (合計)',A,'cm²'],['形心距參考軸',center,'cm'],['I (形心軸)',I,'cm⁴'],['I (參考軸)',I+A*center**2,'cm⁴'],['r',Math.sqrt(I/A),'cm']];
    for (const [field,sign,edge] of [['cTop',1,'頂緣'],['cBottom',-1,'底緣']]) {
      const input=document.getElementById('g-'+field);
      if (!input?.value.trim() && !input?.validity?.badInput) continue;
      const c=geometryNumber(field)/10;
      if (!(c>0) || parts.some(p=>sign*(p.d-center)>c+1e-12)) return invalidGeometry(`${edge}距離須為正，並涵蓋各子斷面形心。`);
      results.push([`S (${edge})`,I/c,'cm³']);
    }
    drawGeoGeneral(parts);
  }
  if (results.some(([,value])=>!Number.isFinite(value))) return invalidGeometry('尺寸超過可計算範圍，請核對單位及輸入。');
  if(results.length) {
    showResults(results);
    if (typeof redrawSectionCard === 'function') redrawSectionCard();
  }
}

// ==================== GEO DRAW HELPERS ====================
function drawGeoRect(bmm,hmm,mode) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/bmm,(H-80)/hmm),sw=bmm*sc,sh=hmm*sc,ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.fillRect(ox,oy,sw,sh);ctx.strokeRect(ox,oy,sw,sh);
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`b=${bmm}`);drawDimV(ctx,ox-26,oy,oy+sh,`h=${hmm}`);
    if(mode==='center') drawAxes(ctx,ox+sw/2,oy+sh/2,Math.max(sw,sh)/2+14);
    else { ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle='#ef4444';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ox-18,oy+sh);ctx.lineTo(ox+sw+18,oy+sh);ctx.stroke();ctx.setLineDash([]);ctx.restore(); }
  });
}
function drawGeoRotRect(bmm,hmm,deg) {
  drawSection((ctx,W,H)=>{
    const th=deg*PI/180,sc=Math.min((W-110)/(bmm*Math.abs(Math.cos(th))+hmm*Math.abs(Math.sin(th))),(H-80)/(bmm*Math.abs(Math.sin(th))+hmm*Math.abs(Math.cos(th))));
    const cx=W/2,cy=H/2;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(-th);
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.fillRect(-bmm*sc/2,-hmm*sc/2,bmm*sc,hmm*sc);ctx.strokeRect(-bmm*sc/2,-hmm*sc/2,bmm*sc,hmm*sc);
    ctx.restore();
    dimText(ctx,`b=${bmm}, h=${hmm}, θ=${deg}°`,cx,H-14);
    drawAxes(ctx,cx,cy,80);
  });
}
function drawGeoDiamond(amm) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/(amm*Math.sqrt(2)),(H-80)/(amm*Math.sqrt(2))),s=amm*sc/Math.sqrt(2),cx=W/2,cy=H/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s,cy);ctx.closePath();ctx.fill();ctx.stroke();
    dimText(ctx,`a=${amm} mm`,cx+s/2+24,cy-s/2-8);drawAxes(ctx,cx,cy,s+14);
  });
}
function drawGeoHollowRect(b,h,b1,h1) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/b,(H-80)/h),sw=b*sc,sh=h*sc,sw1=b1*sc,sh1=h1*sc,ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.fillRect(ox,oy,sw,sh);ctx.strokeRect(ox,oy,sw,sh);
    ctx.fillStyle='#f8fafc';ctx.fillRect(ox+(sw-sw1)/2,oy+(sh-sh1)/2,sw1,sh1);ctx.strokeRect(ox+(sw-sw1)/2,oy+(sh-sh1)/2,sw1,sh1);
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`b=${b} (內 ${b1})`);
    drawDimV(ctx,ox-26,oy,oy+sh,`h=${h}`);
    drawAxes(ctx,ox+sw/2,oy+sh/2,Math.max(sw,sh)/2+14);

}
function drawGeoCircle(D,d) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/D,(H-80)/D),sr=D/2*sc,cx=W/2,cy=H/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,sr,0,PI*2);ctx.fill();ctx.stroke();
    if(d>0){const sir=d/2*sc;ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(cx,cy,sir,0,PI*2);ctx.fill();ctx.stroke();dimText(ctx,`d=${d}`,cx+sir/2+22,cy-sir/2);}
    drawDimH(ctx,cx-sr,cx+sr,cy+sr+22,`D=${D} mm`);drawAxes(ctx,cx,cy,sr+14);
  });
}
function drawGeoSemicircle(rmm) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/(rmm*2),(H-80)/rmm),sr=rmm*sc,cx=W/2,cy=H/2+sr/3;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,sr,PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    drawDimH(ctx,cx-sr,cx+sr,cy+22,`2r=${rmm*2} (r=${rmm})`);drawAxes(ctx,cx,cy-4*rmm*sc/(3*PI),sr+14);
  });
}
function drawGeoTriangle(bmm,hmm,mode) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/bmm,(H-80)/hmm),sw=bmm*sc,sh=hmm*sc,ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox+sw/2,oy);ctx.lineTo(ox+sw,oy+sh);ctx.lineTo(ox,oy+sh);ctx.closePath();ctx.fill();ctx.stroke();
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`b=${bmm}`);drawDimV(ctx,ox-26,oy,oy+sh,`h=${hmm}`);
    if(mode==='center'){drawAxes(ctx,ox+sw/2,oy+sh-sh/3,Math.max(sw,sh)/2+12);}
  });
}
function drawGeoTrapezoid(b,b1,h,mode) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/Math.max(b,b1),(H-80)/h),sw=b*sc,sw1=b1*sc,sh=h*sc,ox=(W-sw)/2,oy=(H-sh)/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox+(sw-sw1)/2,oy);ctx.lineTo(ox+(sw+sw1)/2,oy);ctx.lineTo(ox+sw,oy+sh);ctx.lineTo(ox,oy+sh);ctx.closePath();ctx.fill();ctx.stroke();
    drawDimH(ctx,ox,ox+sw,oy+sh+22,`b=${b}`);dimText(ctx,`b₁=${b1}`,ox+sw/2,oy-12);drawDimV(ctx,ox-26,oy,oy+sh,`h=${h}`);
    if(mode==='center'){const e=sh*(b+2*b1)/(3*(b+b1));drawAxes(ctx,ox+sw/2,oy+sh-e,Math.max(sw,sh)/2+12);}
  });
}
function drawGeoPolygon(n,amm,rotDeg) {
  drawSection((ctx,W,H)=>{
    const a=amm, alpha=PI/n, r2=a/(2*Math.sin(alpha));
    const sc=Math.min((W-110)/(2*r2),(H-80)/(2*r2)),sr=r2*sc,cx=W/2,cy=H/2,rot=rotDeg*PI/180-PI/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<n;i++){const ang=rot+2*PI*i/n;ctx.lineTo(cx+sr*Math.cos(ang),cy+sr*Math.sin(ang));}
    ctx.closePath();ctx.fill();ctx.stroke();
    dimText(ctx,`n=${n}, a=${fmt(amm)} mm`,cx,cy+sr+22);drawAxes(ctx,cx,cy,sr+14);
  });
}
function drawGeoHollowDiamond(bmm,amm) {
  drawSection((ctx,W,H)=>{
    const sc=Math.min((W-110)/(bmm*Math.sqrt(2)),(H-80)/(bmm*Math.sqrt(2)));
    const cx=W/2,cy=H/2,sb=bmm*sc/Math.sqrt(2),sa=amm*sc/Math.sqrt(2);
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy-sb);ctx.lineTo(cx+sb,cy);ctx.lineTo(cx,cy+sb);ctx.lineTo(cx-sb,cy);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.moveTo(cx,cy-sa);ctx.lineTo(cx+sa,cy);ctx.lineTo(cx,cy+sa);ctx.lineTo(cx-sa,cy);ctx.closePath();ctx.fill();ctx.stroke();
    dimText(ctx,`外 b=${bmm}, 內 a=${amm}`,cx,cy+sb+22);
    drawAxes(ctx,cx,cy,sb+14);
  });
}
function drawGeoTee(bf,tf,hw,tw) {
  drawSection((ctx,W,H)=>{
    const Hmm=parseFloat(hw)+parseFloat(tf),sc=Math.min((W-110)/bf,(H-80)/Hmm);
    const swf=bf*sc,stf=Math.max(2,tf*sc),shw=hw*sc,stw=Math.max(2,tw*sc),ox=(W-swf)/2,oy=(H-(shw+stf))/2;
    ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+swf,oy);ctx.lineTo(ox+swf,oy+stf);ctx.lineTo(ox+swf/2+stw/2,oy+stf);ctx.lineTo(ox+swf/2+stw/2,oy+stf+shw);ctx.lineTo(ox+swf/2-stw/2,oy+stf+shw);ctx.lineTo(ox+swf/2-stw/2,oy+stf);ctx.lineTo(ox,oy+stf);ctx.closePath();ctx.fill();ctx.stroke();
    drawDimH(ctx,ox,ox+swf,oy-18,`bf=${bf} (tf=${tf})`);
    drawDimV(ctx,ox+swf/2+stw/2+26,oy+stf,oy+stf+shw,`hw=${hw} (tw=${tw})`);
    const Af=bf*tf,Aw=hw*tw,Ybar=(Af*(hw+tf/2)+Aw*(hw/2))/(Af+Aw);
    drawAxes(ctx,ox+swf/2,oy+stf+shw-Ybar*sc,Math.max(swf,shw+stf)/2+12);
  });
}
function drawGeoGeneral(parts) {
  drawSection((ctx,W,H)=>{
    const axisY=Math.round(H*0.53),topY=58,bottomY=H-48;
    const maxPositive=Math.max(0,...parts.map(part=>part.dmm));
    const maxNegative=Math.max(0,...parts.map(part=>-part.dmm));
    const positiveScale=maxPositive ? (axisY-topY)/maxPositive : Infinity;
    const negativeScale=maxNegative ? (bottomY-axisY)/maxNegative : Infinity;
    const finiteScales=[positiveScale,negativeScale].filter(Number.isFinite);
    const distanceScale=finiteScales.length ? Math.min(0.6,...finiteScales) : 0;
    const xPositions=parts.length===1
      ? [W/2]
      : parts.map((_,index)=>70+index*(W-140)/(parts.length-1));

    ctx.fillStyle='#1e293b';
    ctx.font='bold 12px "Microsoft JhengHei","Segoe UI",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('平行軸定理計算模型（非實際比例）',W/2,18);
    ctx.fillStyle='#475569';
    ctx.font='12px Consolas,monospace';
    ctx.fillText('I = Σ(I₀ᵢ + Aᵢdᵢ²)',W/2,37);

    ctx.save();
    ctx.setLineDash([6,4]);
    ctx.strokeStyle='#ef4444';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(24,axisY);ctx.lineTo(W-24,axisY);ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#b91c1c';
    ctx.font='11px "Microsoft JhengHei","Segoe UI",sans-serif';
    ctx.textAlign='right';
    ctx.fillText('輸入參考軸',W-27,axisY-7);

    parts.forEach((part,index)=>{
      const x=xPositions[index],y=axisY-part.dmm*distanceScale;
      const subscript=['','₁','₂','₃'][part.index] || String(part.index);
      ctx.save();
      ctx.setLineDash([3,3]);
      ctx.strokeStyle='#64748b';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,axisY);ctx.lineTo(x,y);ctx.stroke();
      ctx.restore();

      ctx.fillStyle='#dbeafe';
      ctx.strokeStyle='#2563eb';
      ctx.lineWidth=2;
      ctx.fillRect(x-35,y-18,70,36);
      ctx.strokeRect(x-35,y-18,70,36);
      ctx.fillStyle='#1e3a8a';
      ctx.font='bold 10px "Microsoft JhengHei","Segoe UI",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(`子斷面 ${part.index}`,x,y-3);
      ctx.font='10px Consolas,monospace';
      ctx.fillText(`A${subscript}=${fmt(part.Amm2)}`,x,y+11);
      ctx.fillStyle='#ef4444';
      ctx.beginPath();ctx.arc(x,y,3,0,PI*2);ctx.fill();

      const labelY=Math.abs(y-axisY)>38 ? (y+axisY)/2+4 : axisY+29;
      ctx.fillStyle='rgba(250,251,252,0.94)';
      ctx.fillRect(x-38,labelY-11,76,16);
      ctx.fillStyle='#475569';
      ctx.font='10px Consolas,monospace';
      ctx.textAlign='center';
      ctx.fillText(`d${subscript}=${fmt(part.dmm)} mm`,x,labelY);
    });

    ctx.fillStyle='#64748b';
    ctx.font='10px "Microsoft JhengHei","Segoe UI",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('各子斷面形心相對輸入參考軸的位置；不代表實際外形',W/2,H-10);
  },'平行軸定理一般組合斷面計算模型，非實際比例');
}

// ==================== CUSTOM ====================
function addRect() {
  const c=document.getElementById('custom-rects'); if(!c) return clearSectionResults();
  const n=c.children.length+1, d=document.createElement('div');
  d.className='custom-rect-row';
  d.innerHTML=`<div style="font-size:0.85em;font-weight:600;color:var(--text-light);margin-bottom:4px;">矩形 ${n}</div><div class="form-row3"><div class="form-group"><label>b</label><input type="number" value="100" step="any" class="rect-b" oninput="calcCustom()"></div><div class="form-group"><label>h</label><input type="number" value="10" step="any" class="rect-h" oninput="calcCustom()"></div><div class="form-group"><label>yc</label><input type="number" value="0" step="any" class="rect-yc" oninput="calcCustom()"></div></div>`;
  c.appendChild(d);
  calcCustom();
}
function removeRect() {
  const c=document.getElementById('custom-rects');
  if(c&&c.children.length>1) {
    c.removeChild(c.lastChild);
    calcCustom();
  }
}
function calcCustom() {
  const rows=document.querySelectorAll('#custom-rects .custom-rect-row'), rects=[];
  rows.forEach(r=>{const b=parseFloat(r.querySelector('.rect-b')?.value)||0,h=parseFloat(r.querySelector('.rect-h')?.value)||0,yc=parseFloat(r.querySelector('.rect-yc')?.value)||0;if(b>0&&h>0) rects.push({b:b/10,h:h/10,yc:yc/10,bmm:b,hmm:h,ycmm:yc});});
  if (!rects.length || rects.length !== rows.length) return clearSectionResults();
  const A=rects.reduce((s,r)=>s+r.b*r.h,0), Ybar=rects.reduce((s,r)=>s+r.b*r.h*r.yc,0)/A;
  const Ix=rects.reduce((s,r)=>s+r.b*r.h**3/12+r.b*r.h*(r.yc-Ybar)**2,0);
  const Iy=rects.reduce((s,r)=>s+r.h*r.b**3/12,0);
  const yt=Math.max(...rects.map(r=>r.yc+r.h/2))-Ybar, yb=Ybar-Math.min(...rects.map(r=>r.yc-r.h/2));
  showResults([['A',A,'cm²'],['Ybar',Ybar,'cm'],['Ix',Ix,'cm⁴'],['Iy',Iy,'cm⁴'],['Sx_top',Ix/yt,'cm³'],['Sx_bot',Ix/yb,'cm³'],['Sx (控制)',Math.min(Ix/yt,Ix/yb),'cm³'],['rx',Math.sqrt(Ix/A),'cm'],['ry',Math.sqrt(Iy/A),'cm']]);
  drawSection((ctx,cW,cH)=>{
    if(!rects.length) return;
    const ymin=Math.min(...rects.map(r=>r.ycmm-r.hmm/2)),ymax=Math.max(...rects.map(r=>r.ycmm+r.hmm/2)),bmax=Math.max(...rects.map(r=>r.bmm)),tH=Math.max(1,ymax-ymin);
    const sc=Math.min((cW-110)/bmax,(cH-80)/tH);
    const topPad = (cH - tH * sc) / 2;
    rects.forEach(r=>{const sw=r.bmm*sc,sh=r.hmm*sc,ox=(cW-sw)/2,oy=(cH-topPad)-(r.ycmm+r.hmm/2-ymin)*sc;ctx.fillStyle='#dbeafe';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.fillRect(ox,oy,sw,sh);ctx.strokeRect(ox,oy,sw,sh);});
    const cgY=(cH-topPad)-(Ybar*10-ymin)*sc;
    drawAxes(ctx,cW/2,cgY,Math.max(bmax*sc,tH*sc)/2+14);
    dimText(ctx,`C.G. (Y=${fmt(Ybar)} cm)`,cW/2+54,cgY-14);
  });
}
