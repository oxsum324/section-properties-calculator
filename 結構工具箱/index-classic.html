<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>結構工具箱｜舊網址相容入口</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="core/style.css">
  <link rel="stylesheet" href="core/direct-print-boundary.css">
  <style>
    .compatibility-shell {
      max-width: 760px;
      margin: 56px auto;
      padding: 0 20px;
    }
    .compatibility-card {
      display: grid;
      gap: 18px;
      padding: 28px;
      border: 1px solid #d7e3ef;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 38px rgba(15, 39, 64, 0.08);
    }
    .compatibility-card h1,
    .compatibility-card p { margin: 0; }
    .compatibility-card p { color: var(--text-light); line-height: 1.75; }
    .compatibility-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .compatibility-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      color: var(--primary);
      background: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .compatibility-actions a.primary {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }
    .compatibility-note {
      padding: 14px 16px;
      border-left: 4px solid #0b7285;
      border-radius: 8px;
      background: #f0f9ff;
      color: #164e63;
      line-height: 1.7;
    }
  </style>
</head>
<body class="formal-tool-output-page">
  <aside class="formal-direct-print-boundary" aria-hidden="true">
    <strong>舊網址相容入口列印已封鎖</strong>
    <span>此頁只保留舊書籤相容與導向功能，不是工具清冊、巡檢狀態或計算書；本頁不得作為附件。請關閉列印視窗，改由目前工具首頁選擇工具並從個別工具產生計算書。</span>
  </aside>
  <main class="compatibility-shell">
    <section class="compatibility-card" aria-labelledby="compatibilityTitle">
      <p>結構工具箱</p>
      <h1 id="compatibilityTitle">舊網址相容入口</h1>
      <p>舊版選單曾重複維護工具版本、能力與成熟度，容易與目前首頁及正式 release 證據不同步。此網址現在只保留既有書籤相容；工具清冊、使用邊界與巡檢狀態均以目前工具首頁為唯一公開來源。</p>
      <div class="compatibility-note">這裡不宣告個別工具版本、通過數或更新日期，因此不會把歷史畫面誤認為目前工具狀態。</div>
      <div class="compatibility-actions">
        <a class="primary" href="./index.html">開啟目前工具首頁</a>
        <a href="./audit-dashboard.html">查看平台公開巡檢狀態</a>
      </div>
    </section>
  </main>
</body>
</html>
