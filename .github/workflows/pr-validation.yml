name: PR validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-preflight:
    name: Clean-checkout preflight
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install preflight Python dependencies
        run: >-
          python -m pip install --disable-pip-version-check --progress-bar off
          -r "開挖擋土支撐/backend/requirements.txt"
          pydantic==2.12.5 python-docx==1.2.0 httpx==0.28.1 numpy==2.3.5

      - name: Prepare the CJK font for excavation attachment tests
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP 'NotoSansTC-CI.ttf'
          $url = 'https://raw.githubusercontent.com/google/fonts/869789e84da92782c144d83d69b64cec54905b5f/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf'
          Invoke-WebRequest -Uri $url -OutFile $font -TimeoutSec 60
          $hash = (Get-FileHash -LiteralPath $font -Algorithm SHA256).Hash
          if ($hash -ne '864727D210D54F2537BBE23B3A839436C3992AF72DE9322AF5270897246BD44F') {
            throw 'Unexpected SHA-256 for the pinned Noto Sans TC test font.'
          }
          "STRUT_TEST_CJK_FONT=$font" >> $env:GITHUB_ENV

      # excavation-traceability-contract and independent-engineering-benchmarks
      # load TypeScript from these projects' own locked node_modules.
      - name: Install preflight Node dependencies
        run: |
          npm ci --prefix 開挖擋土支撐/frontend --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix 螺栓檢討/bolt-review-tool --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CI preflight
        shell: cmd
        # The hosted runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...),
        # which realpath expands and the governed "no link redirection" guards reject.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: call run-preflight-tools-ci.bat

      - name: Upload preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-preflight-${{ github.run_id }}
          path: |
            output/preflight/preflight-summary.md
            output/preflight/preflight-summary.json
            output/preflight/history/
          if-no-files-found: warn
          retention-days: 7
