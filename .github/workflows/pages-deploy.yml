name: Pages deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore npm content cache
        id: npm-cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-pages-npm-${{ hashFiles('.github/pages-smoke/package-lock.json') }}

      - name: Restore Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-pages-playwright-${{ hashFiles('.github/pages-smoke/package-lock.json') }}-chromium-v1

      - name: Install pinned Pages smoke runtime
        id: runtime-install
        working-directory: .github/pages-smoke
        run: |
          set +e
          started_ms=$(date +%s%3N)
          npm ci --ignore-scripts --no-audit --no-fund
          exit_code=$?
          duration_ms=$(($(date +%s%3N) - started_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Verify clean source checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify tested release lineage
        run: |
          node "結構工具箱/tools/verify-pages-release-lineage.js" \
            --repo-root "." \
            --head-sha "$GITHUB_SHA" \
            --expected-branch "master"

      - name: Stage static site
        run: |
          set -euo pipefail
          node "結構工具箱/tools/build-pages-artifact.js" --repo-root "." --site-root "_site"
          node "結構工具箱/tools/build-pages-clean-routes.js" --site-root "_site" --config "vercel.json"
          touch _site/.nojekyll
          node "結構工具箱/tools/build-pages-deployment-manifest.js" \
            --site-root "_site" \
            --commit-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-dirty "false" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Verify staged Pages artifact
        id: staged-smoke
        env:
          PAGES_HTTP_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-http-smoke-result.json
          PAGES_BROWSER_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-browser-smoke-result.json
        run: |
          set -euo pipefail
          base_url="http://127.0.0.1:4173/"
          server_log="$RUNNER_TEMP/pages-staged-server.log"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$server_log" 2>&1 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup_server EXIT

          ready=false
          for _ in {1..40}; do
            if curl --fail --silent --show-error --output /dev/null "$base_url"; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            cat "$server_log"
            exit 1
          fi

          node "結構工具箱/tools/pages-live-smoke.js" \
            --base-url "$base_url" \
            --check-private-boundary \
            --expected-commit-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expect-clean-source
          bash "結構工具箱/tools/run-pages-browser-smoke.sh" "$base_url" "pages-staged-browser"

      - name: Archive GitHub Pages artifact
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Prepare build CI evidence
        if: always()
        env:
          PAGES_CI_ACTION: prepare
          PAGES_CI_JOB: build
          PAGES_RUNTIME_LOCK_DIGEST: ${{ hashFiles('.github/pages-smoke/package-lock.json') }}
          PAGES_NPM_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          PAGES_BROWSER_CACHE_HIT: ${{ steps.playwright-browser-cache.outputs.cache-hit }}
          PAGES_RUNTIME_INSTALL_OUTCOME: ${{ steps.runtime-install.outcome }}
          PAGES_RUNTIME_INSTALL_DURATION_MS: ${{ steps.runtime-install.outputs.duration_ms }}
          PAGES_HTTP_SMOKE_OUTCOME: ${{ steps.staged-smoke.outcome }}
          PAGES_BROWSER_SMOKE_OUTCOME: ${{ steps.staged-smoke.outcome }}
          PAGES_HTTP_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-http-smoke-result.json
          PAGES_BROWSER_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-browser-smoke-result.json
          PAGES_CI_PERFORMANCE_BUDGET_FILE: .github/pages-smoke/performance-budget.json
          PAGES_CI_EVIDENCE_FILE: ${{ runner.temp }}/pages-ci-evidence/build.json
        run: node .github/pages-smoke/write-ci-summary.js

      - name: Upload build CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pages-ci-evidence-build
          path: ${{ runner.temp }}/pages-ci-evidence/build.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish build CI evidence
        if: always()
        env:
          PAGES_CI_ACTION: summary
          PAGES_CI_JOB: build
          PAGES_CI_JOB_STATUS: ${{ job.status }}
          PAGES_CI_EVIDENCE_FILE: ${{ runner.temp }}/pages-ci-evidence/build.json
        run: node .github/pages-smoke/write-ci-summary.js

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live-smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore npm content cache
        id: npm-cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-pages-npm-${{ hashFiles('.github/pages-smoke/package-lock.json') }}

      - name: Restore Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-pages-playwright-${{ hashFiles('.github/pages-smoke/package-lock.json') }}-chromium-v1

      - name: Install pinned Pages smoke runtime
        id: runtime-install
        working-directory: .github/pages-smoke
        run: |
          set +e
          started_ms=$(date +%s%3N)
          npm ci --ignore-scripts --no-audit --no-fund
          exit_code=$?
          duration_ms=$(($(date +%s%3N) - started_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Run live Pages smoke
        id: live-http-smoke
        env:
          PAGES_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PAGES_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PAGES_EXPECTED_RUN_ID: ${{ github.run_id }}
          PAGES_EXPECT_CLEAN_SOURCE: 1
          PAGES_HTTP_SMOKE_ATTEMPTS: 2
          PAGES_HTTP_SMOKE_RETRY_DELAY_SECONDS: 5
          PAGES_HTTP_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-http-smoke-result.json
        run: node "結構工具箱/tools/pages-live-smoke.js" --check-private-boundary

      - name: Run live Pages browser smoke
        id: live-browser-smoke
        env:
          PAGES_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PAGES_BROWSER_SMOKE_ATTEMPTS: 2
          PAGES_BROWSER_SMOKE_RETRY_DELAY_SECONDS: 5
          PAGES_BROWSER_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-browser-smoke-result.json
        run: bash "結構工具箱/tools/run-pages-browser-smoke.sh" "$PAGES_BASE_URL" "pages-live-browser"

      - name: Prepare live CI evidence
        if: always()
        env:
          PAGES_CI_ACTION: prepare
          PAGES_CI_JOB: live-smoke
          PAGES_RUNTIME_LOCK_DIGEST: ${{ hashFiles('.github/pages-smoke/package-lock.json') }}
          PAGES_NPM_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          PAGES_BROWSER_CACHE_HIT: ${{ steps.playwright-browser-cache.outputs.cache-hit }}
          PAGES_RUNTIME_INSTALL_OUTCOME: ${{ steps.runtime-install.outcome }}
          PAGES_RUNTIME_INSTALL_DURATION_MS: ${{ steps.runtime-install.outputs.duration_ms }}
          PAGES_HTTP_SMOKE_OUTCOME: ${{ steps.live-http-smoke.outcome }}
          PAGES_BROWSER_SMOKE_OUTCOME: ${{ steps.live-browser-smoke.outcome }}
          PAGES_HTTP_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-http-smoke-result.json
          PAGES_BROWSER_SMOKE_RESULT_FILE: ${{ runner.temp }}/pages-browser-smoke-result.json
          PAGES_CI_PERFORMANCE_BUDGET_FILE: .github/pages-smoke/performance-budget.json
          PAGES_CI_EVIDENCE_FILE: ${{ runner.temp }}/pages-ci-evidence/live-smoke.json
        run: node .github/pages-smoke/write-ci-summary.js

      - name: Upload live CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pages-ci-evidence-live-smoke
          path: ${{ runner.temp }}/pages-ci-evidence/live-smoke.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish live CI evidence
        if: always()
        env:
          PAGES_CI_ACTION: summary
          PAGES_CI_JOB: live-smoke
          PAGES_CI_JOB_STATUS: ${{ job.status }}
          PAGES_CI_EVIDENCE_FILE: ${{ runner.temp }}/pages-ci-evidence/live-smoke.json
        run: node .github/pages-smoke/write-ci-summary.js

  performance-trend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - live-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download current build evidence
        uses: actions/download-artifact@v8
        with:
          name: pages-ci-evidence-build
          path: ${{ runner.temp }}/pages-ci-trend-input/${{ github.run_id }}

      - name: Download current live evidence
        uses: actions/download-artifact@v8
        with:
          name: pages-ci-evidence-live-smoke
          path: ${{ runner.temp }}/pages-ci-trend-input/${{ github.run_id }}

      - name: Download previous successful Pages evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-ci-trend-input"
          gh run list \
            --workflow pages-deploy.yml \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId' | while read -r run_id; do
              [[ -n "$run_id" && "$run_id" != "$GITHUB_RUN_ID" ]] || continue
              artifacts=$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100")
              build_count=$(jq '[.artifacts[] | select(.expired == false and .name == "pages-ci-evidence-build")] | length' <<<"$artifacts")
              live_count=$(jq '[.artifacts[] | select(.expired == false and .name == "pages-ci-evidence-live-smoke")] | length' <<<"$artifacts")
              if [[ "$build_count" -eq 0 && "$live_count" -eq 0 ]]; then
                continue
              fi
              if [[ "$build_count" -eq 0 || "$live_count" -eq 0 ]]; then
                echo "::warning title=Pages CI historical evidence excluded::Run $run_id has an incomplete build/live evidence pair and is excluded from the trend."
                continue
              fi
              if [[ "$build_count" -gt 1 || "$live_count" -gt 1 ]]; then
                echo "::warning title=Pages CI historical evidence deduplicated::Run $run_id has rerun artifacts; the newest build and live receipts are selected."
              fi
              build_id=$(jq -r '[.artifacts[] | select(.expired == false and .name == "pages-ci-evidence-build")] | sort_by(.created_at, .id) | last | .id' <<<"$artifacts")
              live_id=$(jq -r '[.artifacts[] | select(.expired == false and .name == "pages-ci-evidence-live-smoke")] | sort_by(.created_at, .id) | last | .id' <<<"$artifacts")
              run_root="$RUNNER_TEMP/pages-ci-trend-input/$run_id"
              mkdir -p "$run_root"
              gh api "repos/$GH_REPO/actions/artifacts/$build_id/zip" > "$RUNNER_TEMP/pages-ci-build-$run_id.zip"
              unzip -q "$RUNNER_TEMP/pages-ci-build-$run_id.zip" -d "$run_root"
              gh api "repos/$GH_REPO/actions/artifacts/$live_id/zip" > "$RUNNER_TEMP/pages-ci-live-$run_id.zip"
              unzip -q "$RUNNER_TEMP/pages-ci-live-$run_id.zip" -d "$run_root"
            done

      - name: Prepare Pages CI performance trend
        env:
          PAGES_CI_TREND_ACTION: prepare
          PAGES_CI_TREND_INPUT_DIR: ${{ runner.temp }}/pages-ci-trend-input
          PAGES_CI_TREND_FILE: ${{ runner.temp }}/pages-ci-performance-trend/pages-ci-performance-trend.json
          PAGES_CI_TREND_MAX_RUNS: 20
        run: node .github/pages-smoke/build-performance-trend.js

      - name: Upload Pages CI performance trend
        uses: actions/upload-artifact@v6
        with:
          name: pages-ci-performance-trend
          path: ${{ runner.temp }}/pages-ci-performance-trend/pages-ci-performance-trend.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish Pages CI performance trend
        env:
          PAGES_CI_TREND_ACTION: summary
          PAGES_CI_TREND_FILE: ${{ runner.temp }}/pages-ci-performance-trend/pages-ci-performance-trend.json
        run: node .github/pages-smoke/build-performance-trend.js
